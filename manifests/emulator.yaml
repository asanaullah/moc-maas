# The model. llm-d's vLLM emulator, OpenAI API over TLS on port 8000, no GPU.
# The certificate is the service CA's, for maas-sim.<namespace>.svc (vLLM takes
# the same --ssl-certfile and --ssl-keyfile flags).
# A Deployment, so a crashed pod is replaced. "maas-sim" is not a Hugging Face
# model name, so the emulator uses its built-in tokenizer and downloads nothing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-sim
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
    app: maas-sim
spec:
  replicas: 2
  selector:
    matchLabels:
      app: maas-sim
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: maas-test
        app: maas-sim
    spec:
      containers:
        - name: sim
          image: ghcr.io/llm-d/llm-d-inference-sim@sha256:1908c421cbb44130a3212934a0dd1e279dacfe3480be93f4c28b45cd29b93ec8
          args:
            - --model=maas-sim
            - --port=8000
            - --ssl-certfile=/etc/tls/tls.crt
            - --ssl-keyfile=/etc/tls/tls.key
            # Room for the webhook profile's large prompts.
            - --max-model-len=32768
            - --max-num-seqs=8
            - --mode=random
            - --time-to-first-token=100ms
            - --inter-token-latency=20ms
            # Slower when all sequences are busy, so load shows up in latency.
            - --time-factor-under-load=2.0
          ports:
            - name: https
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
              scheme: HTTPS
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTPS
          volumeMounts:
            - name: tls
              mountPath: /etc/tls
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: tls
          secret:
            secretName: maas-sim-tls
---
# For direct calls while testing. The gateway doesn't use it: the endpoint
# picker sends each request to a pod address. The service CA writes the
# model pods' certificate into maas-sim-tls.
apiVersion: v1
kind: Service
metadata:
  name: maas-sim
  namespace: "{{ maas_namespace }}"
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: maas-sim-tls
  labels:
    app.kubernetes.io/part-of: maas-test
spec:
  selector:
    app: maas-sim
  ports:
    - name: https
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: maas-sim-pods
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
spec:
  clusterIP: None
  selector:
    app: maas-sim
  ports:
    - name: https
      port: 8000
      targetPort: 8000
