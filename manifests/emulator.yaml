# Step 3: the model. llm-d's vLLM emulator, OpenAI API on port 8000, no GPU.
# A Deployment, so a crashed pod is replaced. "maas-sim" is not a Hugging Face
# model name, so the emulator uses its built-in tokenizer and downloads nothing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-sim
  namespace: uat-project
  labels:
    app.kubernetes.io/part-of: maas-test
    app: maas-sim
spec:
  replicas: 2
  selector:
    matchLabels:
      app: maas-sim
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: maas-test
        app: maas-sim
    spec:
      containers:
        - name: sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v1.0.0
          args:
            - --model=maas-sim
            - --port=8000
            # Room for the webhook profile's large prompts.
            - --max-model-len=32768
            - --max-num-seqs=8
            - --mode=random
            - --time-to-first-token=100ms
            - --inter-token-latency=20ms
            # Slower when all sequences are busy, so load shows up in latency.
            - --time-factor-under-load=2.0
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
# For direct calls while testing. The gateway doesn't use it: the endpoint
# picker sends each request to a pod address.
apiVersion: v1
kind: Service
metadata:
  name: maas-sim
  namespace: uat-project
  labels:
    app.kubernetes.io/part-of: maas-test
spec:
  selector:
    app: maas-sim
  ports:
    - name: http
      port: 8000
      targetPort: 8000
