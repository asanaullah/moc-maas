# PostgreSQL for the MaaS Keycloak, separate from the portals' database
# so identity data and keys don't share a store. Credentials come from the
# maas-sso-db Secret (deploy.yml). Data lives on {{ maas_namespace }}-storage
# under maas/sso-postgres; backups under maas/sso-backups.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: maas-sso-db
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
    app: maas-sso-db
spec:
  # One writer on the data directory at a time.
  replicas: 1
  serviceName: maas-sso-db
  selector:
    matchLabels:
      app: maas-sso-db
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: maas-test
        app: maas-sso-db
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-16@sha256:9223bb5f0745e66f0e4204ff87d4d1a5283f3726e9b7d9b71d7bdb2a650fc218
          # POSTGRESQL_USER, POSTGRESQL_PASSWORD and POSTGRESQL_DATABASE.
          envFrom:
            - secretRef:
                name: maas-sso-db
          env:
            # Sized for 3 Keycloak pods x 30 (KC_DB_POOL_MAX_SIZE), plus backups and admins.
            - {name: POSTGRESQL_MAX_CONNECTIONS, value: "120"}
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            tcpSocket:
              port: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
              subPath: maas/sso-postgres
            - name: tls
              mountPath: /tls
            - name: postgres-cfg
              mountPath: /opt/app-root/src/postgresql-cfg
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: "{{ maas_namespace }}-storage"
        - name: tls
          secret:
            secretName: maas-sso-db-tls
            defaultMode: 0600
        - name: postgres-cfg
          configMap:
            name: maas-postgres-tls
---
apiVersion: v1
kind: Service
metadata:
  name: maas-sso-db
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: maas-sso-db-tls
spec:
  selector:
    app: maas-sso-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
# Daily logical backup to {{ maas_namespace }}-storage under maas/backups, keeping the
# last 14. Start one by hand with:
#   oc create job -n {{ maas_namespace }} maas-sso-db-backup-now --from=cronjob/maas-sso-db-backup
apiVersion: batch/v1
kind: CronJob
metadata:
  name: maas-sso-db-backup
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  # Finished backups leave no pods behind: success shows in the CronJob's
  # lastSuccessfulTime and in the dump files. The last failure is kept, with
  # its pod and logs, to diagnose.
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: maas-test
            app: maas-sso-db-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: pg-dump
              image: registry.redhat.io/rhel9/postgresql-16@sha256:9223bb5f0745e66f0e4204ff87d4d1a5283f3726e9b7d9b71d7bdb2a650fc218
              command: ["bash", "-c"]
              args:
                - set -euo pipefail;
                  f=/backup/maas-sso-$(date -u +%Y%m%dT%H%M%SZ).dump;
                  pg_dump -h maas-sso-db.{{ maas_namespace }}.svc -U "$POSTGRESQL_USER" -d "$POSTGRESQL_DATABASE" -Fc -f "$f.partial";
                  mv "$f.partial" "$f";
                  ls -1t /backup/maas-sso-*.dump | tail -n +15 | xargs -r rm -f;
                  echo "wrote $f ($(stat -c %s "$f") bytes)"
              env:
                - name: POSTGRESQL_USER
                  valueFrom:
                    secretKeyRef: {name: maas-sso-db, key: POSTGRESQL_USER}
                - name: POSTGRESQL_DATABASE
                  valueFrom:
                    secretKeyRef: {name: maas-sso-db, key: POSTGRESQL_DATABASE}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: {name: maas-sso-db, key: POSTGRESQL_PASSWORD}
                # Check the server's certificate against the service CA.
                - {name: PGSSLMODE, value: verify-full}
                - {name: PGSSLROOTCERT, value: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt}
              volumeMounts:
                - name: backup
                  mountPath: /backup
                  subPath: maas/sso-backups
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: "{{ maas_namespace }}-storage"
