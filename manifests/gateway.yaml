# Assisted by Claude Opus
# The gateway. Envoy's HTTP filters, in order:
#   1. removal of the routing and endpoint headers a client may have sent;
#   2. a 4 MiB request-body limit;
#   3. the payload pre-stage, which copies the body's model into a header;
#   4. Kuadrant's wasm-shim, which checks identity with Authorino and the
#      subscription budget with Limitador;
#   5. the payload post-stage, which strips x-maas-* headers and makes streams
#      report usage;
#   6. ext_proc to the endpoint picker, which chooses the model pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-envoy-config
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 19000

    static_resources:
      listeners:
        - name: maas
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8080
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: maas
                    normalize_path: true
                    merge_slashes: true
                    path_with_escaped_slashes_action: REJECT_REQUEST
                    access_log: &maas_access_log
                      - name: envoy.access_loggers.stream
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                          log_format:
                            json_format:
                              time: "%START_TIME%"
                              # The shim exports auth metadata as one protobuf
                              # value, and the post-stage strips x-maas-*; read
                              # the logging header Authorino injects instead.
                              user: "%REQ(X-Auth-User)%"
                              method: "%REQ(:METHOD)%"
                              path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                              code: "%RESPONSE_CODE%"
                              flags: "%RESPONSE_FLAGS%"
                              duration_ms: "%DURATION%"
                              bytes_sent: "%BYTES_SENT%"
                              client: "%DOWNSTREAM_REMOTE_ADDRESS%"
                              dropped: "%RESP(X-LLM-D-REQUEST-DROPPED-REASON)%"
                              upstream: "%UPSTREAM_HOST%"
                    route_config:
                      name: maas
                      virtual_hosts:
                        - name: maas
                          domains: ["*"]
                          routes: &maas_routes
                            - match:
                                prefix: /v1/models
                                headers: [{name: ":method", string_match: {exact: GET}}]
                              route:
                                cluster: maas_api
                              typed_per_filter_config:
                                envoy.filters.http.ext_proc.ipp-pre:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                                  disabled: true
                                envoy.filters.http.ext_proc.ipp-post:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                                  disabled: true
                                envoy.filters.http.ext_proc.epp:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                                  disabled: true
                            - match:
                                prefix: /v1/subscriptions
                              route:
                                cluster: maas_api
                              typed_per_filter_config:
                                envoy.filters.http.ext_proc.ipp-pre:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                                  disabled: true
                                envoy.filters.http.ext_proc.ipp-post:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                                  disabled: true
                                envoy.filters.http.ext_proc.epp:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                                  disabled: true
                            - match:
                                prefix: /v1/api-keys
                              route:
                                cluster: maas_api
                              typed_per_filter_config:
                                envoy.filters.http.ext_proc.ipp-pre:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                                  disabled: true
                                envoy.filters.http.ext_proc.ipp-post:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                                  disabled: true
                                envoy.filters.http.ext_proc.epp:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                                  disabled: true
                            - match:
                                prefix: /maas-api/v1
                              route:
                                cluster: maas_api
                                prefix_rewrite: /v1
                              typed_per_filter_config:
                                envoy.filters.http.ext_proc.ipp-pre:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                                  disabled: true
                                envoy.filters.http.ext_proc.ipp-post:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                                  disabled: true
                                envoy.filters.http.ext_proc.epp:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                                  disabled: true
                            - match:
                                path: /maas-api/health
                              route:
                                cluster: maas_api
                                prefix_rewrite: /health
                              typed_per_filter_config:
                                envoy.filters.http.ext_proc.ipp-pre:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                                  disabled: true
                                envoy.filters.http.ext_proc.ipp-post:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                                  disabled: true
                                envoy.filters.http.ext_proc.epp:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                                  disabled: true
{% for m in maas_governance_models %}
{% for p in maas_model_paths %}
                            - match:
                                path: {{ p }}
                                headers:
                                  - {name: ":method", string_match: {exact: POST}}
                                  - {name: x-gateway-model-name, string_match: {exact: "{{ m.publisher_id }}"}}
                              route:
                                cluster: model-{{ m.name }}
                                timeout: 600s
                                idle_timeout: 600s
                              request_headers_to_remove: [authorization]
                              response_headers_to_add:
                                - header: {key: x-maas-upstream, value: "%UPSTREAM_REMOTE_ADDRESS%"}
{% endfor %}
{% endfor %}
                            - match:
                                path: /maas-usage/metrics
                              route:
                                cluster: maas-usage-metrics
                                prefix_rewrite: /user-metrics
                              request_headers_to_remove: [authorization]
                              typed_per_filter_config:
                                envoy.filters.http.ext_proc.ipp-pre:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                                  disabled: true
                                envoy.filters.http.ext_proc.ipp-post:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                                  disabled: true
                                envoy.filters.http.ext_proc.epp:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                                  disabled: true
                            - match:
                                prefix: "/"
                              direct_response:
                                status: 404
                                body:
                                  inline_string: "not found\n"
                              typed_per_filter_config:
                                envoy.filters.http.ext_proc.ipp-post:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                                  disabled: true
                                envoy.filters.http.ext_proc.epp:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                                  disabled: true
                    http_filters: &maas_http_filters
                      - name: envoy.filters.http.header_mutation
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                          mutations:
                            request_mutations:
                              - remove: x-gateway-destination-endpoint
                              - remove: x-gateway-destination-endpoint-subset
                              - remove: x-gateway-model-name
                              - remove: x-ipp-selected-provider
                              - remove: x-llm-d-inference-fairness-id
                              - remove: x-gateway-inference-fairness-id
                              - remove: x-llm-d-inference-objective
                              - remove: x-gateway-inference-objective
                              - remove: x-maas-username
                              - remove: x-maas-group
                              - remove: x-maas-username-token
                              - remove: x-maas-group-token
                              - remove: x-auth-user
                      - name: envoy.filters.http.buffer
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.buffer.v3.Buffer
                          max_request_bytes: {{ maas_body_limit_bytes | int }}
                      - name: envoy.filters.http.ext_proc.ipp-pre
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                          grpc_service:
                            envoy_grpc:
                              cluster_name: ipp_pre
                            timeout: 300s
                          failure_mode_allow: true
                          allow_mode_override: true
                          processing_mode:
                            request_header_mode: SEND
                            response_header_mode: SKIP
                            request_body_mode: FULL_DUPLEX_STREAMED
                            response_body_mode: NONE
                            request_trailer_mode: SEND
                          message_timeout: 300s
                      - name: envoy.filters.http.wasm
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                          config:
                            name: kuadrant_wasm
                            root_id: kuadrant_wasm
                            vm_config:
                              vm_id: vm.sentinel.kuadrant_wasm
                              runtime: envoy.wasm.runtime.v8
                              code:
                                local:
                                  filename: /wasm/plugin.wasm
                              allow_precompiled: true
                            configuration:
                              "@type": type.googleapis.com/google.protobuf.StringValue
                              value: '{{ maas_wasm_config_json }}'
                      - name: envoy.filters.http.ext_proc.ipp-post
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                          grpc_service:
                            envoy_grpc:
                              cluster_name: ipp_post
                            timeout: 300s
                          failure_mode_allow: false
                          processing_mode:
                            request_header_mode: SEND
                            response_header_mode: SEND
                            request_body_mode: FULL_DUPLEX_STREAMED
                            response_body_mode: FULL_DUPLEX_STREAMED
                            request_trailer_mode: SEND
                            response_trailer_mode: SEND
                          message_timeout: 300s
                      - name: envoy.filters.http.ext_proc.epp
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                          grpc_service:
                            envoy_grpc:
                              cluster_name: epp
                              authority: maas-epp.{{ maas_namespace }}.svc:9002
                            timeout: 10s
                          failure_mode_allow: true
                          processing_mode:
                            request_header_mode: SEND
                            response_header_mode: SEND
                            request_body_mode: FULL_DUPLEX_STREAMED
                            response_body_mode: FULL_DUPLEX_STREAMED
                            request_trailer_mode: SEND
                            response_trailer_mode: SEND
                          message_timeout: 600s
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

        - name: maas-tls
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8443
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  common_tls_context:
                    tls_params:
                      tls_minimum_protocol_version: TLSv1_2
                    tls_certificates:
                      - certificate_chain: {filename: /etc/tls/tls.crt}
                        private_key: {filename: /etc/tls/tls.key}
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: maas-tls
                    normalize_path: true
                    merge_slashes: true
                    path_with_escaped_slashes_action: REJECT_REQUEST
                    access_log: *maas_access_log
                    route_config:
                      name: maas-tls
                      virtual_hosts:
                        - name: maas
                          domains: ["*"]
                          routes: *maas_routes
                    http_filters: *maas_http_filters

        - name: metrics
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 9901
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: metrics
                    route_config:
                      name: metrics
                      virtual_hosts:
                        - name: metrics
                          domains: ["*"]
                          routes:
                            - match:
                                path: /stats/prometheus
                              route:
                                cluster: envoy_admin
                            - match:
                                prefix: /
                              direct_response:
                                status: 404
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
        - name: envoy_admin
          type: STATIC
          connect_timeout: 1s
          load_assignment:
            cluster_name: envoy_admin
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 19000

        - name: authorino
          type: STATIC
          connect_timeout: 1s
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: authorino
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 50051

        - name: kuadrant-operator-grpc
          type: STATIC
          connect_timeout: 1s
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: kuadrant-operator-grpc
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 50051

        - name: limitador
          type: STRICT_DNS
          connect_timeout: 1s
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: limitador
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: maas-limitador.{{ maas_namespace }}.svc
                          port_value: 8081

        - name: maas_api
          type: STATIC
          connect_timeout: 1s
          load_assignment:
            cluster_name: maas_api
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: {{ maas_api_port }}

        - name: maas-usage-metrics
          type: STRICT_DNS
          connect_timeout: 5s
          load_assignment:
            cluster_name: maas-usage-metrics
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: maas-usage.{{ maas_namespace }}.svc
                          port_value: 9100

        - name: ipp_pre
          type: STRICT_DNS
          connect_timeout: 5s
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: ipp_pre
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: maas-ipp-pre.{{ maas_namespace }}.svc
                          port_value: 9004
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: maas-ipp-pre.{{ maas_namespace }}.svc
              common_tls_context:
                alpn_protocols: ["h2"]

        - name: ipp_post
          type: STRICT_DNS
          connect_timeout: 5s
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: ipp_post
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: maas-ipp-post.{{ maas_namespace }}.svc
                          port_value: 9004
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: maas-ipp-post.{{ maas_namespace }}.svc
              common_tls_context:
                alpn_protocols: ["h2"]

        - name: epp
          type: STRICT_DNS
          connect_timeout: 5s
          lb_policy: LEAST_REQUEST
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: epp
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: maas-epp.{{ maas_namespace }}.svc
                          port_value: 9002
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: maas-epp.{{ maas_namespace }}.svc
              common_tls_context:
                alpn_protocols: ["h2"]
                validation_context:
                  trusted_ca:
                    filename: /etc/maas-ca/service-ca.crt
                  match_typed_subject_alt_names:
                    - san_type: DNS
                      matcher:
                        exact: maas-epp.{{ maas_namespace }}.svc
{% for m in maas_governance_models %}

        - name: model-{{ m.name }}
          type: STRICT_DNS
          connect_timeout: 5s
          dns_refresh_rate: 5s
          load_balancing_policy:
            policies:
              - typed_extension_config:
                  name: envoy.load_balancing_policies.override_host
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.load_balancing_policies.override_host.v3.OverrideHost
                    override_host_sources: [{metadata: {key: envoy.lb, path: [{key: x-gateway-destination-endpoint}]}}]
                    fallback_policy:
                      policies:
                        - typed_extension_config:
                            name: envoy.load_balancing_policies.round_robin
                            typed_config: {"@type": type.googleapis.com/envoy.extensions.load_balancing_policies.round_robin.v3.RoundRobin}
          load_assignment:
            cluster_name: model-{{ m.name }}
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ m.name }}-pods.{{ maas_namespace }}.svc
                          port_value: 8000
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: {{ m.name }}.{{ maas_namespace }}.svc
              common_tls_context:
                validation_context:
                  trusted_ca:
                    filename: /etc/maas-ca/service-ca.crt
                  match_typed_subject_alt_names:
                    - san_type: DNS
                      matcher:
                        exact: {{ m.name }}.{{ maas_namespace }}.svc
          circuit_breakers:
            thresholds:
              - max_connections: 10000
                max_pending_requests: 10000
                max_requests: 10000
{% endfor %}
---
# Authorino's status updater reads its leader-election namespace from this
# file, the one an in-cluster pod gets from its service account. The pod runs
# with no service-account token (it uses the private API server), so the file
# is mounted explicitly.
apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-pod-namespace
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
data:
  namespace: "{{ maas_namespace }}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-gateway
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
    app: maas-gateway
spec:
  replicas: {{ maas_gateway_replicas }}
  selector:
    matchLabels:
      app: maas-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: maas-test
        app: maas-gateway
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: maas-gateway
      terminationGracePeriodSeconds: {{ maas_gateway_drain_seconds | int + 30 }}
      initContainers:
        # The shim comes from the RHCL wasm-shim image, which holds the
        # release file at /plugin.wasm; registry.access.redhat.com pulls
        # anonymously, so no registry login is needed.
        - name: fetch-wasm-shim
          image: "{{ maas_image_wasm_shim }}"
          command: ["cp", "/plugin.wasm", "/wasm/plugin.wasm"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - name: wasm
              mountPath: /wasm
      containers:
        - name: envoy
          image: "{{ maas_image_envoy }}"
          command: ["/usr/local/bin/envoy"]
          args: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info", "--concurrency", "{{ maas_envoy_concurrency }}"]
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
            - name: metrics
              containerPort: 9901
          lifecycle:
            preStop:
              sleep:
                seconds: {{ maas_gateway_drain_seconds | int }}
          readinessProbe:
            tcpSocket:
              port: 8080
          volumeMounts:
            - name: tls
              mountPath: /etc/tls
              readOnly: true
            - name: config
              mountPath: /etc/envoy
            - name: wasm
              mountPath: /wasm
            - name: service-ca
              mountPath: /etc/maas-ca
              readOnly: true
          resources:
            requests: {cpu: 500m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
        - name: authorino
          image: "{{ maas_image_authorino }}"
          args:
            - --watch-namespace={{ maas_namespace }}
            - --auth-config-label-selector=maas.moc/managed=true
            - --ext-auth-grpc-port=50051
            - --ext-auth-http-port=5001
            - --oidc-http-port=8083
            - --metrics-addr=:8082
            - --health-probe-addr=:8084
            - --enable-leader-election
            - --log-level=info
          env:
            - {name: KUBECONFIG, value: /kubeconfig/kubeconfig}
            - {name: SSL_CERT_DIR, value: "/etc/pki/tls/certs:/etc/maas-ingress-ca"}
          ports:
            - {name: grpc, containerPort: 50051}
            - {name: metrics, containerPort: 8082}
            - {name: health, containerPort: 8084}
          readinessProbe:
            httpGet: {path: /readyz, port: 8084}
          livenessProbe:
            httpGet: {path: /healthz, port: 8084}
          volumeMounts:
            - name: kubeconfig-authorino
              mountPath: /kubeconfig
            - name: service-ca
              mountPath: /etc/maas-kube-ca
              readOnly: true
            - name: ingress-ca
              mountPath: /etc/maas-ingress-ca
              readOnly: true
            - name: pod-namespace
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
        - name: maas-api
          image: "{{ maas_image_maas_api }}"
          env:
            - {name: KUBECONFIG, value: /kubeconfig/kubeconfig}
            - {name: NAMESPACE, value: "{{ maas_namespace }}"}
            - {name: MAAS_SUBSCRIPTION_NAMESPACE, value: "{{ maas_namespace }}"}
            - {name: GATEWAY_NAMESPACE, value: "{{ maas_namespace }}"}
            - {name: GATEWAY_NAME, value: "{{ maas_gateway_name }}"}
            - {name: TENANT_NAME, value: "{{ maas_tenant_name }}"}
            - {name: ADDRESS, value: "127.0.0.1:{{ maas_api_port }}"}
            - {name: SECURE, value: "false"}
            - {name: METRICS_PORT, value: "{{ maas_api_metrics_port }}"}
            - {name: API_KEY_MAX_EXPIRATION_DAYS, value: "{{ maas_api_key_max_days }}"}
          ports:
            - {name: api, containerPort: {{ maas_api_port }}}
            - {name: metrics, containerPort: {{ maas_api_metrics_port }}}
          readinessProbe:
            exec:
              command: ["curl", "-sf", "http://127.0.0.1:{{ maas_api_port }}/health"]
          livenessProbe:
            exec:
              command: ["curl", "-sf", "http://127.0.0.1:{{ maas_api_port }}/health"]
          volumeMounts:
            - name: kubeconfig-maas-api
              mountPath: /kubeconfig
            - name: service-ca
              mountPath: /etc/maas-kube-ca
              readOnly: true
            - name: service-ca
              mountPath: /etc/maas-ca
              readOnly: true
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
        - name: key-cleanup
          image: "{{ maas_image_cli }}"
          command:
            - sh
            - -c
            - "while true; do sleep {{ maas_key_cleanup_seconds }}; curl -sf -X POST http://127.0.0.1:{{ maas_api_port }}/internal/v1/api-keys/cleanup >/dev/null || echo cleanup call failed; done"
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: config
          configMap:
            name: maas-envoy-config
        - name: wasm
          emptyDir: {}
        - name: service-ca
          configMap:
            name: maas-service-ca
        - name: ingress-ca
          configMap:
            name: maas-ingress-ca
        - name: pod-namespace
          configMap:
            name: maas-pod-namespace
            items:
              - {key: namespace, path: namespace}
        - name: tls
          secret:
            secretName: maas-gateway-tls
        - name: kubeconfig-authorino
          secret:
            secretName: maas-kube-kubeconfig-authorino
        - name: kubeconfig-maas-api
          secret:
            secretName: maas-kube-kubeconfig-maas-api
---
# "http" serves clients inside the namespace; "https" carries the Route. The
# service CA writes the certificate for the TLS listener into maas-gateway-tls.
apiVersion: v1
kind: Service
metadata:
  name: maas-gateway
  namespace: "{{ maas_namespace }}"
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: maas-gateway-tls
  labels:
    app.kubernetes.io/part-of: maas-test
spec:
  selector:
    app: maas-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: https
      port: 8443
      targetPort: 8443
