# The MaaS's own identity provider: Red Hat build of Keycloak, realm
# "maas", where users sign in with GitHub. Namespace members manage users and
# groups in Keycloak's admin console and map groups to subscriptions with
# playbooks/admin.yml.
#
# Needs these Secrets in {{ maas_namespace }}:
#   maas-sso-db, maas-sso-admin, maas-usage-oidc  (deploy.yml)
#   maas-sso-github                               (deploy.yml or github-secret.yml)
#
# Keycloak's admin console is never exposed: an Envoy sidecar in each pod is
# the only thing the Route reaches, and it forwards /realms/maas/ and
# /resources/ only. Reach the admin console with
#   oc port-forward -n {{ maas_namespace }} deploy/maas-sso 9443:8443
# then https://localhost:9443/admin/ (the certificate is for the Service name,
# so the browser warns), as the user in maas-sso-admin.
#
# After the first start, deploy.yml points the admin console's login at
# the port-forward too; the public address blocks the master
# realm.

# Realm "maas", imported on Keycloak's first start only; later changes are made
# in the admin console. ${...} values are filled from the pod's environment at
# import time, so no secret is written here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-sso-realm
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
data:
  maas-realm.json: |
    {
      "realm": "maas",
      "displayName": "MOC MaaS",
      "enabled": true,
      "sslRequired": "external",
      "registrationAllowed": false,
      "resetPasswordAllowed": false,
      "rememberMe": false,
      "loginWithEmailAllowed": false,
      "duplicateEmailsAllowed": false,
      "editUsernameAllowed": false,
      "bruteForceProtected": true,
      "permanentLockout": false,
      "failureFactor": 10,
      "accessTokenLifespan": 300,
      "ssoSessionIdleTimeout": 1800,
      "ssoSessionMaxLifespan": 28800,
      "eventsEnabled": true,
      "eventsExpiration": 7776000,
      "adminEventsEnabled": true,
      "adminEventsDetailsEnabled": true,
      "identityProviders": [
        {
          "alias": "github",
          "displayName": "GitHub",
          "providerId": "github",
          "enabled": true,
          "trustEmail": true,
          "storeToken": false,
          "addReadTokenRoleOnCreate": false,
          "linkOnly": false,
          "firstBrokerLoginFlowAlias": "first broker login",
          "config": {
            "clientId": "${GITHUB_CLIENT_ID}",
            "clientSecret": "${GITHUB_CLIENT_SECRET}",
            "syncMode": "IMPORT"
          }
        }
      ],
      "clients": []
    }
---
# The sidecar in front of Keycloak. Only our realm's endpoints and the static
# files its pages load are forwarded; /admin, the master realm and everything
# else get 404 before reaching Keycloak.
apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-sso-proxy
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: public
          address:
            socket_address: {address: 0.0.0.0, port_value: 8444}
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  common_tls_context:
                    tls_certificates:
                      - certificate_chain: {filename: /etc/tls/tls.crt}
                        private_key: {filename: /etc/tls/tls.key}
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: public
                    # The router replaces any client-supplied X-Forwarded-For
                    # with the user's address; with use_remote_address false
                    # the sidecar passes it on unchanged, so Keycloak's
                    # brute-force protection sees the user's address.
                    use_remote_address: false
                    xff_num_trusted_hops: 1
                    normalize_path: true
                    merge_slashes: true
                    path_with_escaped_slashes_action: REJECT_REQUEST
                    route_config:
                      name: public
                      virtual_hosts:
                        - name: keycloak
                          domains: ["*"]
                          routes:
                            - match: {prefix: "/realms/maas/"}
                              route: {cluster: keycloak, timeout: 30s}
                            - match: {prefix: "/resources/"}
                              route: {cluster: keycloak, timeout: 30s}
                            - match: {prefix: "/"}
                              direct_response:
                                status: 404
                                body: {inline_string: "not found\n"}
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: keycloak
          type: STATIC
          connect_timeout: 2s
          load_assignment:
            cluster_name: keycloak
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: {address: 127.0.0.1, port_value: 8443}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: maas-sso.{{ maas_namespace }}.svc
              common_tls_context:
                validation_context:
                  trusted_ca:
                    filename: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
                  match_typed_subject_alt_names:
                    - san_type: DNS
                      matcher: {exact: maas-sso.{{ maas_namespace }}.svc}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-sso
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
    app: maas-sso
spec:
  # Two Keycloak nodes, clustered through their shared database (JDBC_PING).
  replicas: 2
  selector:
    matchLabels:
      app: maas-sso
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: maas-test
        app: maas-sso
    spec:
      # Keycloak's JDBC root and the proxy read service-ca.crt from the
      # ServiceAccount mount.
      automountServiceAccountToken: true
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: maas-sso
      containers:
        - name: keycloak
          image: registry.redhat.io/rhbk/keycloak-rhel9@sha256:d6cada4ca8a5fe7b5ef850319aa5e1b8afa0ed50d0b1eb272147257cdb41ddbc
          args: ["start", "--import-realm"]
          env:
            # Public address for browsers; backchannel calls may use the Service name instead.
            - name: KC_HOSTNAME
              value: https://maas-sso-{{ maas_namespace }}.{{ maas_apps_domain }}
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_HOSTNAME_ADMIN
              value: https://localhost:9443
            # Only the sidecar's forwarded headers are believed.
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_PROXY_TRUSTED_ADDRESSES
              value: 127.0.0.1/32
            - name: KC_HTTP_ENABLED
              value: "false"
            - name: KC_HTTPS_CERTIFICATE_FILE
              value: /etc/tls/tls.crt
            - name: KC_HTTPS_CERTIFICATE_KEY_FILE
              value: /etc/tls/tls.key
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: "jdbc:postgresql://maas-sso-db.{{ maas_namespace }}.svc:5432/keycloak?sslmode=verify-full&sslrootcert=/var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt"
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef: {name: maas-sso-db, key: POSTGRESQL_USER}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: maas-sso-db, key: POSTGRESQL_PASSWORD}
            - name: KC_DB_POOL_MAX_SIZE
              value: "30"
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef: {name: maas-sso-admin, key: KC_BOOTSTRAP_ADMIN_USERNAME}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: maas-sso-admin, key: KC_BOOTSTRAP_ADMIN_PASSWORD}
            # Read by the realm import only.
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef: {name: maas-sso-github, key: client-id}
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: maas-sso-github, key: client-secret}
            # Read by deploy.yml's usage-client step, so the user
            # dashboard's client secret never leaves the cluster.
            - name: USAGE_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: maas-usage-oidc, key: client-secret}
            # kcadm.sh signs in as the maas-kcadm client with this; sync creates it.
            - name: KCADM_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: maas-kcadm, key: client-secret, optional: true}
          ports:
            - name: https
              containerPort: 8443
            - name: management
              containerPort: 9000
            - name: jgroups
              containerPort: 7800
          startupProbe:
            httpGet: {path: /health/started, port: 9000, scheme: HTTPS}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: 9000, scheme: HTTPS}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: 9000, scheme: HTTPS}
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: tls
              mountPath: /etc/tls
              readOnly: true
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 1536Mi
        - name: proxy
          image: docker.io/envoyproxy/envoy@sha256:45876da26cbb8ef73ef86e985586f363a619eef9c0081a9c3a781cb4b3b9255e
          command: ["envoy"]
          args: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warn", "--concurrency", "2"]
          ports:
            - name: public
              containerPort: 8444
          readinessProbe:
            tcpSocket: {port: 8444}
          volumeMounts:
            - name: proxy-config
              mountPath: /etc/envoy
            - name: tls
              mountPath: /etc/tls
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: tls
          secret:
            secretName: maas-sso-tls
        - name: realm
          configMap:
            name: maas-sso-realm
        - name: proxy-config
          configMap:
            name: maas-sso-proxy
---
# The service CA writes a certificate for maas-sso.{{ maas_namespace }}.svc into the
# maas-sso-tls Secret. The Route goes to "public" (the sidecar); the admin
# commands inside the pods talk to Keycloak directly on "https".
apiVersion: v1
kind: Service
metadata:
  name: maas-sso
  namespace: "{{ maas_namespace }}"
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: maas-sso-tls
  labels:
    app.kubernetes.io/part-of: maas-test
spec:
  selector:
    app: maas-sso
  ports:
    - name: public
      port: 8444
      targetPort: 8444
    - name: https
      port: 8443
      targetPort: 8443
