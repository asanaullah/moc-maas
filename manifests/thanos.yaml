# Thanos Store, Query and Compactor, reading the metrics bucket
# alongside the Prometheus sidecar.
#
#   Store      serves the blocks in the metrics bucket
#   Query      the one address Grafana and the user dashboard query
#              (maas-thanos-query:9090); merges Prometheus's recent hours with
#              the folder's history, and picks downsampled data for long ranges
#   Compactor  compacts and downsamples the blocks and deletes them
#              after 90 days, at every resolution (raw, 5 minutes, 1 hour).
#              Exactly one may run.
#
# Query talks gRPC to Store and the sidecar over TLS, checking the service CA
# certificate issued for maas-thanos-grpc.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-thanos-store
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
    app: maas-thanos-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maas-thanos-store
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: maas-test
        app: maas-thanos-store
        maas-metrics: thanos
    spec:
      automountServiceAccountToken: false
      containers:
        - name: store
          image: quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:a493512f8444a93cac0431f959309cf0d0559a513ec87ea297bab97ea2198126
          args:
            - store
            - --data-dir=/data
            - --objstore.config-file=/etc/thanos/objstore.yml
            - --grpc-address=0.0.0.0:10901
            - --http-address=0.0.0.0:10902
            - --grpc-server-tls-cert=/etc/tls/grpc/tls.crt
            - --grpc-server-tls-key=/etc/tls/grpc/tls.key
            - --grpc-server-tls-min-version=1.2
          ports:
            - {name: grpc, containerPort: 10901}
            - {name: http, containerPort: 10902}
          readinessProbe:
            httpGet: {path: /-/ready, port: 10902}
          livenessProbe:
            httpGet: {path: /-/healthy, port: 10902}
            initialDelaySeconds: 30
            periodSeconds: 20
          env:
            - {name: SSL_CERT_FILE, value: /etc/maas-s3-ca/s3-ca.crt}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: objstore, mountPath: /etc/thanos, readOnly: true}
            - {name: s3-ca, mountPath: /etc/maas-s3-ca, readOnly: true}
            - {name: grpc-tls, mountPath: /etc/tls/grpc, readOnly: true}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        # An index cache only; rebuilt from the blocks after a restart.
        - name: data
          emptyDir: {sizeLimit: 5Gi}
        - name: objstore
          secret: {secretName: maas-thanos-objstore}
        - name: s3-ca
          configMap: {name: maas-s3-ca}
        - name: grpc-tls
          secret: {secretName: maas-thanos-grpc-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: maas-thanos-store
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
spec:
  selector:
    app: maas-thanos-store
  ports:
    - {name: grpc, port: 10901, targetPort: 10901}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-thanos-query
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
    app: maas-thanos-query
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maas-thanos-query
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: maas-test
        app: maas-thanos-query
    spec:
      # The gRPC client CA comes from the ServiceAccount mount.
      automountServiceAccountToken: true
      containers:
        - name: query
          image: quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:a493512f8444a93cac0431f959309cf0d0559a513ec87ea297bab97ea2198126
          args:
            - query
            # Serves both the query API (for Grafana and the dashboard) and its
            # own metrics on 9090.
            - --http-address=0.0.0.0:9090
            - --grpc-address=127.0.0.1:10901
            - --endpoint=maas-prometheus.{{ maas_namespace }}.svc.cluster.local:10901
            - --endpoint=maas-thanos-store.{{ maas_namespace }}.svc.cluster.local:10901
            - --grpc-client-tls-secure
            - --grpc-client-tls-ca=/var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
            - --grpc-client-server-name=maas-thanos-grpc.{{ maas_namespace }}.svc
            - --query.auto-downsampling
            - --web.disable-cors
          ports:
            - {name: http, containerPort: 9090}
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
          livenessProbe:
            httpGet: {path: /-/healthy, port: 9090}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: maas-thanos-query
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
spec:
  selector:
    app: maas-thanos-query
  ports:
    - {name: http, port: 9090, targetPort: 9090}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-thanos-compact
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
    app: maas-thanos-compact
spec:
  # Never two at once: concurrent compactors corrupt the blocks.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: maas-thanos-compact
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: maas-test
        app: maas-thanos-compact
        maas-metrics: thanos
    spec:
      automountServiceAccountToken: false
      containers:
        - name: compact
          image: quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:a493512f8444a93cac0431f959309cf0d0559a513ec87ea297bab97ea2198126
          args:
            - compact
            - --wait
            - --data-dir=/data
            - --objstore.config-file=/etc/thanos/objstore.yml
            - --http-address=0.0.0.0:10902
            - --retention.resolution-raw=90d
            - --retention.resolution-5m=90d
            - --retention.resolution-1h=90d
          ports:
            - {name: http, containerPort: 10902}
          readinessProbe:
            httpGet: {path: /-/ready, port: 10902}
          livenessProbe:
            httpGet: {path: /-/healthy, port: 10902}
            initialDelaySeconds: 30
            periodSeconds: 20
          env:
            - {name: SSL_CERT_FILE, value: /etc/maas-s3-ca/s3-ca.crt}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: objstore, mountPath: /etc/thanos, readOnly: true}
            - {name: s3-ca, mountPath: /etc/maas-s3-ca, readOnly: true}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        # Scratch space while compacting; nothing here needs keeping.
        - name: data
          emptyDir: {sizeLimit: 10Gi}
        - name: objstore
          secret: {secretName: maas-thanos-objstore}
        - name: s3-ca
          configMap: {name: maas-s3-ca}
