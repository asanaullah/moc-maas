# The endpoint picker. It watches the InferencePool and its pods and
# tells the gateway which emulator pod gets each request, with its built-in
# queue, KV-cache and prefix-cache scoring. The pool is FailOpen.
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: maas-pool
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
spec:
  selector:
    matchLabels:
      app: maas-sim
  targetPorts:
    - number: 8000
  endpointPickerRef:
    name: maas-epp
    port:
      number: 9002
    failureMode: FailOpen
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-epp-config
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
data:
  config.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
      - type: queue-scorer
      - type: kv-cache-utilization-scorer
      - type: prefix-cache-scorer
      - type: metrics-data-source
        parameters: {scheme: https, path: /metrics, insecureSkipVerify: true}
      - type: core-metrics-extractor
    dataLayer:
      sources:
        - pluginRef: metrics-data-source
          extractors: [{pluginRef: core-metrics-extractor}]
    schedulingProfiles:
      - name: default
        plugins:
          - {pluginRef: queue-scorer, weight: 2}
          - {pluginRef: kv-cache-utilization-scorer, weight: 2}
          - {pluginRef: prefix-cache-scorer, weight: 3}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-epp
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
    app: maas-epp
spec:
  replicas: 2
  # Leader election and a rolling update deadlock: the new pod cannot become
  # Ready until the old leader's lease is free, and the Deployment will not
  # stop the old leader first. This matches the upstream chart.
  strategy:
    type: Recreate
    # The previous object carries the default rollingUpdate block; null clears
    # it, because the API rejects it with Recreate.
    rollingUpdate: null
  selector:
    matchLabels:
      app: maas-epp
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: maas-test
        app: maas-epp
    spec:
      # From manifests/prereqs: read access to the pool and its pods.
      serviceAccountName: uat-epp
      # Leader election and InferencePool discovery need the API token.
      automountServiceAccountToken: true
      # Best effort: spread the two replicas over nodes when the cluster has
      # more than one, but still schedule both on a single-node cluster.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: maas-epp
      containers:
        - name: epp
          image: "{{ maas_image_epp }}"
          args:
            - --pool-name=maas-pool
            - --pool-namespace={{ maas_namespace }}
            - --config-file=/etc/epp/config.yaml
            - --grpc-port=9002
            - --metrics-port=9090
            # Serves gRPC over TLS with the service CA's certificate, reloaded
            # when the service CA rotates it.
            - --cert-path=/etc/epp-tls
            - --enable-cert-reload
            # Metrics auth needs token and access reviews, which are cluster
            # scoped and not granted.
            - --metrics-endpoint-auth=false
            # No trace collector in this namespace; exporting only logs errors.
            - --tracing=false
            # Two replicas, one active: the standby holds a warm datastore and
            # takes the lease when the leader goes away.
            - --ha-enable-leader-election
          ports:
            - name: grpc
              containerPort: 9002
            - name: grpc-health
              containerPort: 9003
            - name: metrics
              containerPort: 9090
          # Only the leader reports Ready, so the Service has one endpoint.
          readinessProbe:
            grpc:
              port: 9003
              service: readiness
          livenessProbe:
            grpc:
              port: 9003
              service: liveness
          volumeMounts:
            - name: config
              mountPath: /etc/epp
            - name: tls
              mountPath: /etc/epp-tls
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: maas-epp-config
        - name: tls
          secret:
            secretName: maas-epp-tls
---
# Only the leader is Ready, so a voluntary eviction of it would leave no
# picker. The unready standby may still be evicted.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: maas-epp
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
    app: maas-epp
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: maas-epp
---
# The service CA writes a certificate for maas-epp.{{ maas_namespace }}.svc into the
# maas-epp-tls Secret.
apiVersion: v1
kind: Service
metadata:
  name: maas-epp
  namespace: "{{ maas_namespace }}"
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: maas-epp-tls
  labels:
    app.kubernetes.io/part-of: maas-test
    app: maas-epp
spec:
  selector:
    app: maas-epp
  ports:
    - name: grpc
      port: 9002
      targetPort: 9002
      appProtocol: kubernetes.io/h2c
    - name: metrics
      port: 9090
      targetPort: 9090
