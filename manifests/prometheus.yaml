# The MaaS's own Prometheus, with a Thanos sidecar.
#
# Prometheus keeps about six hours locally, in an emptyDir, cut into 2-hour
# blocks; the sidecar uploads each finished block to the metrics bucket.
# Everything older than a few hours is read
# back through Thanos. A lost pod loses at most the newest couple of
# hours (a known constraint).
#
# Targets are found through headless Services (DNS), one per component, so
# Prometheus needs no Kubernetes API rights. Images are the ones the cluster's
# own monitoring runs (OpenShift 4.22).

apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-prometheus-config
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
      # Thanos needs labels that identify this Prometheus among its stores.
      external_labels:
        cluster: oac-dev-workload0
        namespace: "{{ maas_namespace }}"
        prometheus: maas-prometheus
    # The MaaS's alerts are evaluated here, where the metrics are; firing ones
    # show at /alerts and in Grafana's Health row (the ALERTS series).
    rule_files: [/etc/prometheus/alerts.yml]
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["127.0.0.1:9090"]
      - job_name: limitador
        dns_sd_configs:
          - names: [maas-metrics-limitador.{{ maas_namespace }}.svc.cluster.local]
            type: A
            port: 8080
      - job_name: endpoint-picker
        dns_sd_configs:
          - names: [maas-metrics-epp.{{ maas_namespace }}.svc.cluster.local]
            type: A
            port: 9090
      - job_name: model
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
          server_name: maas-sim.{{ maas_namespace }}.svc
        dns_sd_configs:
          - names: [maas-metrics-sim.{{ maas_namespace }}.svc.cluster.local]
            type: A
            port: 8000
      - job_name: gateway
        metrics_path: /stats/prometheus
        dns_sd_configs:
          - names: [maas-metrics-gateway.{{ maas_namespace }}.svc.cluster.local]
            type: A
            port: 9901
      - job_name: key-portal
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
          server_name: maas-keys.{{ maas_namespace }}.svc
        dns_sd_configs:
          - names: [maas-metrics-keys.{{ maas_namespace }}.svc.cluster.local]
            type: A
            port: 8081
      - job_name: admin-portal
        dns_sd_configs:
          - names: [maas-metrics-admin.{{ maas_namespace }}.svc.cluster.local]
            type: A
            port: 9100
      - job_name: keycloak
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
          server_name: maas-sso.{{ maas_namespace }}.svc
        dns_sd_configs:
          - names: [maas-metrics-sso.{{ maas_namespace }}.svc.cluster.local]
            type: A
            port: 9000
      - job_name: thanos-query
        static_configs:
          - targets: ["maas-thanos-query.{{ maas_namespace }}.svc.cluster.local:9090"]
      - job_name: thanos
        dns_sd_configs:
          - names:
              - maas-metrics-thanos.{{ maas_namespace }}.svc.cluster.local
              - maas-metrics-prometheus.{{ maas_namespace }}.svc.cluster.local
            type: A
            port: 10902
  alerts.yml: |
    groups:
      - name: maas
        rules:
          - alert: MaasTargetDown
            expr: up == 0
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "{{ '{{' }} $labels.job {{ '}}' }} target {{ '{{' }} $labels.instance {{ '}}' }} has been unreachable for 5 minutes"
          - alert: MaasReconcilerStopped
            expr: time() - max(maas_reconcile_last_success_timestamp_seconds) > 1800
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "The key reconciler hasn't finished a pass for 30 minutes; removed or disabled users keep their keys"
          - alert: MaasReconcilerMissing
            expr: absent(maas_reconcile_last_success_timestamp_seconds)
            for: 15m
            labels: {severity: warning}
            annotations:
              summary: "No reconciler metric from the admin portal for 15 minutes"
          - alert: MaasReconcilerRefused
            expr: max(maas_reconcile_refused_users) > 0
            labels: {severity: critical}
            annotations:
              summary: "The reconciler found most users gone in Keycloak and revoked nothing; check Keycloak before it is fixed"
          - alert: MaasPlanHasNoBudget
            expr: maas_plan_limit_loaded == 0
            for: 2m
            labels: {severity: critical}
            annotations:
              summary: "Limitador has no limit for plan {{ '{{' }} $labels.plan {{ '}}' }}; its users get 403 plan not active yet"
          - alert: MaasLimitsUnknown
            expr: sum(rate(maas_key_checks_total{result="limits_unknown"}[5m])) > 0
            for: 5m
            labels: {severity: critical}
            annotations:
              summary: "The key check can't read Limitador's limits; requests get 503"
          - alert: MaasKeyCheckConnectFailures
            expr: sum(rate(envoy_cluster_upstream_cx_connect_fail{envoy_cluster_name="maas_keys"}[5m])) > 0
            for: 5m
            labels: {severity: critical}
            annotations:
              summary: "The gateway can't connect to the key check"
          - alert: MaasVolumeFillingUp
            expr: maas_volume_free_bytes / maas_volume_size_bytes < 0.15
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: "Volume {{ '{{' }} $labels.volume {{ '}}' }} has less than 15% free; the databases and backups live there"
          - alert: MaasPortalDatabaseConnectionsHigh
            expr: maas_db_connections / maas_db_max_connections > 0.8
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "The portal database uses over 80% of max_connections"
          - alert: MaasMetricsUploadFailing
            expr: increase(thanos_shipper_upload_failures_total[1h]) > 0
            labels: {severity: warning}
            annotations:
              summary: "The Thanos sidecar failed to upload a block to the metrics bucket (credentials or CA?)"
          - alert: MaasMetricsCompactorHalted
            expr: max(thanos_compact_halted) > 0
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "The Thanos compactor halted; the bucket needs attention"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-prometheus
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
    app: maas-prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: maas-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: maas-test
        app: maas-prometheus
        maas-metrics: thanos-sidecar
    spec:
      containers:
        - name: prometheus
          image: quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:e9f9d90f665aa34bede233ebfa89d03d5cd0a3c6224af5fd55de2235309a485a
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h
            # Fixed 2-hour blocks, so the sidecar can upload each one as it closes.
            - --storage.tsdb.min-block-duration=2h
            - --storage.tsdb.max-block-duration=2h
            - --web.listen-address=0.0.0.0:9090
            - --web.enable-lifecycle
          ports:
            - {name: web, containerPort: 9090}
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
          livenessProbe:
            httpGet: {path: /-/healthy, port: 9090}
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - {name: data, mountPath: /prometheus}
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "1", memory: 2Gi}
        - name: thanos-sidecar
          image: quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:a493512f8444a93cac0431f959309cf0d0559a513ec87ea297bab97ea2198126
          args:
            - sidecar
            - --prometheus.url=http://127.0.0.1:9090
            - --tsdb.path=/prometheus
            - --objstore.config-file=/etc/thanos/objstore.yml
            - --reloader.config-file=/etc/prometheus/prometheus.yml
            - --reloader.rule-dir=/etc/prometheus
            - --grpc-address=0.0.0.0:10901
            - --http-address=0.0.0.0:10902
            # Query reaches this over TLS; the certificate is maas-thanos-grpc's.
            - --grpc-server-tls-cert=/etc/tls/grpc/tls.crt
            - --grpc-server-tls-key=/etc/tls/grpc/tls.key
            - --grpc-server-tls-min-version=1.2
          ports:
            - {name: grpc, containerPort: 10901}
            - {name: http, containerPort: 10902}
          readinessProbe:
            httpGet: {path: /-/ready, port: 10902}
          env:
            - {name: SSL_CERT_FILE, value: /etc/maas-s3-ca/s3-ca.crt}
          volumeMounts:
            - {name: data, mountPath: /prometheus}
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: objstore, mountPath: /etc/thanos, readOnly: true}
            - {name: s3-ca, mountPath: /etc/maas-s3-ca, readOnly: true}
            - {name: grpc-tls, mountPath: /etc/tls/grpc, readOnly: true}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 5Gi}
        - name: config
          configMap: {name: maas-prometheus-config}
        - name: objstore
          secret: {secretName: maas-thanos-objstore}
        - name: s3-ca
          configMap: {name: maas-s3-ca}
        - name: grpc-tls
          secret: {secretName: maas-thanos-grpc-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: maas-prometheus
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
spec:
  selector:
    app: maas-prometheus
  ports:
    - {name: web, port: 9090, targetPort: 9090}
    - {name: grpc, port: 10901, targetPort: 10901}
---
# The gRPC servers (this sidecar and Thanos Store) present one service CA
# certificate, issued for this Service's name, so Query can verify both with
# one server name. The Service routes nowhere useful on its own.
apiVersion: v1
kind: Service
metadata:
  name: maas-thanos-grpc
  namespace: "{{ maas_namespace }}"
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: maas-thanos-grpc-tls
  labels:
    app.kubernetes.io/part-of: maas-test
spec:
  clusterIP: None
  selector:
    maas-metrics: thanos-grpc-tls-only
  ports:
    - {name: grpc, port: 10901, targetPort: 10901}
---
# Headless Services: Prometheus finds every pod of each component through DNS.
apiVersion: v1
kind: Service
metadata: {name: maas-metrics-limitador, namespace: "{{ maas_namespace }}", labels: {app.kubernetes.io/part-of: maas-test}}
spec: {clusterIP: None, selector: {app: maas-limitador}, ports: [{name: metrics, port: 8080}]}
---
apiVersion: v1
kind: Service
metadata: {name: maas-metrics-epp, namespace: "{{ maas_namespace }}", labels: {app.kubernetes.io/part-of: maas-test}}
spec: {clusterIP: None, selector: {app: maas-epp}, ports: [{name: metrics, port: 9090}]}
---
apiVersion: v1
kind: Service
metadata: {name: maas-metrics-sim, namespace: "{{ maas_namespace }}", labels: {app.kubernetes.io/part-of: maas-test}}
spec: {clusterIP: None, selector: {app: maas-sim}, ports: [{name: metrics, port: 8000}]}
---
apiVersion: v1
kind: Service
metadata: {name: maas-metrics-gateway, namespace: "{{ maas_namespace }}", labels: {app.kubernetes.io/part-of: maas-test}}
spec: {clusterIP: None, selector: {app: maas-gateway}, ports: [{name: metrics, port: 9901}]}
---
apiVersion: v1
kind: Service
metadata: {name: maas-metrics-keys, namespace: "{{ maas_namespace }}", labels: {app.kubernetes.io/part-of: maas-test}}
spec: {clusterIP: None, selector: {app: maas-keys}, ports: [{name: metrics, port: 8081}]}
---
apiVersion: v1
kind: Service
metadata: {name: maas-metrics-admin, namespace: "{{ maas_namespace }}", labels: {app.kubernetes.io/part-of: maas-test}}
spec: {clusterIP: None, selector: {app: maas-admin}, ports: [{name: metrics, port: 9100}]}
---
apiVersion: v1
kind: Service
metadata: {name: maas-metrics-sso, namespace: "{{ maas_namespace }}", labels: {app.kubernetes.io/part-of: maas-test}}
spec: {clusterIP: None, selector: {app: maas-sso}, ports: [{name: metrics, port: 9000}]}
---
apiVersion: v1
kind: Service
metadata: {name: maas-metrics-prometheus, namespace: "{{ maas_namespace }}", labels: {app.kubernetes.io/part-of: maas-test}}
spec: {clusterIP: None, selector: {app: maas-prometheus}, ports: [{name: metrics, port: 10902}]}
---
apiVersion: v1
kind: Service
metadata: {name: maas-metrics-thanos, namespace: "{{ maas_namespace }}", labels: {app.kubernetes.io/part-of: maas-test}}
spec: {clusterIP: None, selector: {maas-metrics: thanos}, ports: [{name: metrics, port: 10902}]}
