# PostgreSQL for the portals: plans, allowed users and key hashes.
# The password comes from the maas-db Secret, which the secrets role
# generates. Data lives on {{ maas_namespace }}-storage under maas/postgres for this
# test; the harness will manage that directory once this is a harness step.
# The server speaks TLS with the service CA certificate issued for its
# Service; clients connect with sslmode=verify-full.
apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-postgres-tls
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
data:
  maas-tls.conf: |
    ssl = on
    ssl_cert_file = '/tls/tls.crt'
    ssl_key_file = '/tls/tls.key'
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: maas-db
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
    app: maas-db
spec:
  # One writer on the data directory at a time.
  replicas: 1
  serviceName: maas-db
  selector:
    matchLabels:
      app: maas-db
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: maas-test
        app: maas-db
    spec:
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-16@sha256:9223bb5f0745e66f0e4204ff87d4d1a5283f3726e9b7d9b71d7bdb2a650fc218
          # POSTGRESQL_USER, POSTGRESQL_PASSWORD and POSTGRESQL_DATABASE.
          envFrom:
            - secretRef:
                name: maas-db
          env:
            # Sized for the portals' pools (keys 2x11, usage 2x11, admin 10), doubled for rollouts, plus backups and admins.
            - {name: POSTGRESQL_MAX_CONNECTIONS, value: "150"}
            - name: MAASAPI_PASSWORD
              valueFrom: {secretKeyRef: {name: maas-db-config, key: MAASAPI_PASSWORD}}
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            tcpSocket:
              port: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
              subPath: maas/postgres
            - name: tls
              mountPath: /tls
            - name: postgres-cfg
              mountPath: /opt/app-root/src/postgresql-cfg
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: "{{ maas_namespace }}-storage"
        - name: tls
          secret:
            secretName: maas-db-tls
            defaultMode: 0600
        - name: postgres-cfg
          configMap:
            name: maas-postgres-tls
---
apiVersion: v1
kind: Service
metadata:
  name: maas-db
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: maas-db-tls
spec:
  selector:
    app: maas-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
# Daily logical backup to {{ maas_namespace }}-storage under maas/backups, keeping the
# last 14. Start one by hand with:
#   oc create job -n {{ maas_namespace }} maas-db-backup-now --from=cronjob/maas-db-backup
apiVersion: batch/v1
kind: CronJob
metadata:
  name: maas-db-backup
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
spec:
  schedule: "15 3 * * *"
  concurrencyPolicy: Forbid
  # Finished backups leave no pods behind: success shows in the CronJob's
  # lastSuccessfulTime and in the dump files. The last failure is kept, with
  # its pod and logs, to diagnose.
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: maas-test
            app: maas-db-backup
        spec:
          restartPolicy: Never
          containers:
            - name: pg-dump
              image: registry.redhat.io/rhel9/postgresql-16@sha256:9223bb5f0745e66f0e4204ff87d4d1a5283f3726e9b7d9b71d7bdb2a650fc218
              command: ["bash", "-c"]
              args:
                - set -euo pipefail;
                  f=/backup/maas-$(date -u +%Y%m%dT%H%M%SZ).dump;
                  pg_dump -h maas-db.{{ maas_namespace }}.svc -U "$POSTGRESQL_USER" -d "$POSTGRESQL_DATABASE" -Fc -f "$f.partial";
                  mv "$f.partial" "$f";
                  ls -1t /backup/maas-*.dump | tail -n +15 | xargs -r rm -f;
                  echo "wrote $f ($(stat -c %s "$f") bytes)";
                  f2=/backup/maasapi-$(date -u +%Y%m%dT%H%M%SZ).dump;
                  PGPASSWORD="$MAASAPI_PASSWORD" pg_dump -h maas-db.{{ maas_namespace }}.svc -U maasapi -d maasapi -Fc -f "$f2.partial";
                  mv "$f2.partial" "$f2";
                  ls -1t /backup/maasapi-*.dump | tail -n +15 | xargs -r rm -f;
                  echo "wrote $f2 ($(stat -c %s "$f2") bytes)"
              env:
                - name: POSTGRESQL_USER
                  valueFrom:
                    secretKeyRef: {name: maas-db, key: POSTGRESQL_USER}
                - name: POSTGRESQL_DATABASE
                  valueFrom:
                    secretKeyRef: {name: maas-db, key: POSTGRESQL_DATABASE}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: {name: maas-db, key: POSTGRESQL_PASSWORD}
                - name: MAASAPI_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: maas-db-config, key: MAASAPI_PASSWORD}
                # Check the server's certificate against the service CA.
                - {name: PGSSLMODE, value: verify-full}
                - {name: PGSSLROOTCERT, value: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt}
              volumeMounts:
                - name: backup
                  mountPath: /backup
                  subPath: maas/backups
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: "{{ maas_namespace }}-storage"
