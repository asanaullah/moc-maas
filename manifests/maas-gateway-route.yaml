# Step 18: the gateway's public address. Clients call
#   https://maas-gateway-uat-project.apps.<domain>/v1/chat/completions
# with "Authorization: Bearer <MaaS key>". The router re-encrypts to Envoy's
# TLS listener. The timeout matches Envoy's 600s route timeout, so long
# generations aren't cut off at the router's 30s default.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: maas-gateway
  namespace: uat-project
  labels:
    app.kubernetes.io/part-of: maas-test
  annotations:
    haproxy.router.openshift.io/timeout: 600s
spec:
  to:
    kind: Service
    name: maas-gateway
  port:
    targetPort: https
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
