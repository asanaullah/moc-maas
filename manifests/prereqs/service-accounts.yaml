# Assisted by Claude Opus
# The service accounts the manifests run as, with their Roles. Applied with
# project-admin-role.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uat-epp
  labels: {app.kubernetes.io/part-of: maas-prereqs}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maas-admin
  labels: {app.kubernetes.io/part-of: maas-prereqs}
---
# The key portal and user dashboard: no Kubernetes rights.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maas-keys
  labels: {app.kubernetes.io/part-of: maas-prereqs}
---
# The endpoint picker watches its pool and the pool's pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maas-epp
  labels: {app.kubernetes.io/part-of: maas-prereqs}
rules:
  - apiGroups: ["inference.networking.k8s.io"]
    resources: ["inferencepools"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["llm-d.ai"]
    resources: ["inferenceobjectives", "inferencemodelrewrites"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Leader election between the EPP replicas.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maas-epp
  labels: {app.kubernetes.io/part-of: maas-prereqs}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: maas-epp}
subjects: [{kind: ServiceAccount, name: uat-epp}]
---
# The admin portal rewrites Limitador's limits, and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maas-admin
  labels: {app.kubernetes.io/part-of: maas-prereqs}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["maas-limits"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maas-admin
  labels: {app.kubernetes.io/part-of: maas-prereqs}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: maas-admin}
subjects: [{kind: ServiceAccount, name: maas-admin}]
