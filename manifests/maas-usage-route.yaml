# The user dashboard's public address,
#   https://maas-usage-{{ maas_namespace }}.apps.<domain>/
# Its generated host must match the maas-usage client's redirect URI.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: maas-usage
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
  annotations:
    haproxy.router.openshift.io/set-forwarded-headers: replace
    haproxy.router.openshift.io/hsts_header: max-age=31536000
    # Per client address: open connections and HTTP request rate (clients
    # behind one NAT share them).
    haproxy.router.openshift.io/rate-limit-connections: "true"
    haproxy.router.openshift.io/rate-limit-connections.concurrent-tcp: "{{ maas_route_concurrent_tcp }}"
    haproxy.router.openshift.io/rate-limit-connections.rate-http: "{{ maas_route_rate_http }}"
spec:
  to:
    kind: Service
    name: maas-usage
  port:
    targetPort: https
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
