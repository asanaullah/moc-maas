# Limitador, the token counter. The gateway sends each subscription's
# descriptor; the governance role writes one limit per subscription and model,
# plus a deny-all limit for models no subscription covers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-limitador
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
    app: maas-limitador
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maas-limitador
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: maas-test
        app: maas-limitador
    spec:
      automountServiceAccountToken: false
      shareProcessNamespace: true
      containers:
        - name: limitador
          image: "{{ maas_image_limitador }}"
          # The image's entrypoint is limitador-server.
          args:
            - --metric-labels-default
            - descriptors[1]
            - /etc/limitador/limits.yaml
            - redis
            - redis://maas-redis:6379
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 8081
          readinessProbe:
            tcpSocket:
              port: 8081
          volumeMounts:
            - name: limits
              mountPath: /etc/limitador
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: limits
          configMap:
            name: maas-limits
---
apiVersion: v1
kind: Service
metadata:
  name: maas-limitador
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
spec:
  selector:
    app: maas-limitador
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 8081
      targetPort: 8081
      appProtocol: kubernetes.io/h2c
