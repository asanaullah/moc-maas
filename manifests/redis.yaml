# Redis for Limitador's counters. No persistence in this stage: a
# Limitador restart keeps its counts, a Redis restart does not.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-redis
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
    app: maas-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maas-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: maas-test
        app: maas-redis
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: docker.io/library/redis@sha256:a7aad82554197a54c653388bfded882a59d6b4a02468484bc31bae6772dcc42c
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: maas-redis
  namespace: "{{ maas_namespace }}"
  labels:
    app.kubernetes.io/part-of: maas-test
spec:
  selector:
    app: maas-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
