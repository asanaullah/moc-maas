# Assisted by Claude Opus
- name: Sync the realm with the current Secrets
  kubernetes.core.k8s_exec:
    namespace: "{{ maas_namespace }}"
    pod: "{{ _maas_pod }}"
    container: keycloak
    command: bash /tmp/maas-kcadm.sh sync
  register: _maas_kcadm

- name: Report
  ansible.builtin.debug:
    msg: "{{ _maas_kcadm.stdout_lines }}"
