# Assisted by Claude Opus
- name: Check the arguments
  ansible.builtin.assert:
    that:
      - maas_email is defined
      - maas_email is match('^[A-Za-z0-9._@-]+$')
      - maas_group is defined
      - maas_group is match('^[A-Za-z0-9._-]+$')
    fail_msg: set maas_email and maas_group
    quiet: true

- name: Add the user to the group
  kubernetes.core.k8s_exec:
    namespace: "{{ maas_namespace }}"
    pod: "{{ _maas_pod }}"
    container: keycloak
    command: "bash /tmp/maas-kcadm.sh add {{ maas_email }} {{ maas_group }}"
  register: _maas_kcadm

- name: Report
  ansible.builtin.debug:
    msg: "{{ _maas_kcadm.stdout_lines }}"
