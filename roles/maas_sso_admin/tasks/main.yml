# Assisted by Claude Opus
# Runs one Keycloak admin command inside a maas-sso pod, through the kcadm
# wrapper this role copies in. The command is maas_action; each action file
# checks its own arguments.
- name: Check the action
  ansible.builtin.assert:
    that:
      - maas_action is defined
      - maas_action in ['help', 'init', 'groups', 'group-create', 'group-delete', 'users', 'user-groups', 'user-create', 'user-delete', 'add', 'remove', 'usage-client', 'oidc-client', 'sync']
    fail_msg: set maas_action to one of help, init, groups, group-create, group-delete, users, user-groups, user-create, user-delete, add, remove, usage-client, oidc-client, sync
    quiet: true

- name: Remember which actions are audited
  ansible.builtin.set_fact:
    _maas_sso_audited: ['group-create', 'group-delete', 'user-create', 'user-delete', 'add', 'remove']

- name: Who is running this
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: authentication.k8s.io/v1
      kind: SelfSubjectReview
  register: _maas_ssr
  when: maas_action in _maas_sso_audited

- name: Remember the operator
  ansible.builtin.set_fact:
    _maas_actor: "{{ _maas_ssr.result.status.userInfo.username | default('') }}"
  when: maas_action in _maas_sso_audited

- name: Find a running Keycloak pod
  ansible.builtin.include_role:
    name: maas_common
    tasks_from: find_pod
  vars:
    pod_label: app=maas-sso
    pod_what: deploy/maas-sso
  when: maas_action != 'help'

# The Keycloak image has no tar (which k8s_cp needs for its copy pipe) and
# exec has no stdin, so the wrapper goes in base64-encoded through bash.
- name: Remember the kcadm wrapper, base64-encoded
  ansible.builtin.set_fact:
    _maas_kcadm_b64: "{{ lookup('ansible.builtin.file', role_path ~ '/files/kcadm.sh') | b64encode }}"
  no_log: true
  when: maas_action != 'help'

- name: Put the kcadm wrapper into the pod
  kubernetes.core.k8s_exec:
    namespace: "{{ maas_namespace }}"
    pod: "{{ _maas_pod }}"
    container: keycloak
    command: "bash -c 'echo {{ _maas_kcadm_b64 }} | base64 -d > /tmp/maas-kcadm.sh'"
  when: maas_action != 'help'

- name: "Run {{ maas_action }}"
  ansible.builtin.include_tasks: "{{ maas_action }}.yml"
