# Assisted by Claude Opus
# Sets _maas_pod to one Running pod carrying pod_label, for exec and cp into
# it. Callers pass pod_label (a Kubernetes label selector) and pod_what (what
# to call the thing in messages).
- name: "Find a running {{ pod_what }} pod"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ maas_namespace }}"
    label_selectors: ["{{ pod_label }}"]
  register: _maas_found_pods

- name: "Pick one {{ pod_what }} pod"
  ansible.builtin.set_fact:
    _maas_pod: "{{ _maas_found_pods.resources | selectattr('status.phase', 'equalto', 'Running') | map(attribute='metadata.name') | list | first | default('') }}"

- name: "Check a {{ pod_what }} pod is running"
  ansible.builtin.assert:
    that: _maas_pod | length > 0
    fail_msg: "no running pod of {{ pod_what }} in {{ maas_namespace }}"
    quiet: true
