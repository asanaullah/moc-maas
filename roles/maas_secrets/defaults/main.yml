# Assisted by Claude Opus
# What goes into each generated Secret. The values are only evaluated for the
# secrets that are missing, so the Jinja references to _maas_new never fail.
maas_generated_secrets:
  - maas-db
  - maas-db-config
  - maas-sso-db
  - maas-sso-admin
  - maas-usage-oidc
  - maas-kcadm
  - maas-kube-token-seeder
  - maas-kube-token-authorino
  - maas-kube-token-maas-api
  - maas-kube-token-ipp
  - maas-kube-token-prometheus
  - maas-kube-token-ops

maas_secret_string_data:
  maas-db:
    POSTGRESQL_USER: maas
    POSTGRESQL_DATABASE: maas
    POSTGRESQL_PASSWORD: "{{ _maas_new['maas-db'] }}"
    DATABASE_URL: "postgresql://maas:{{ _maas_new['maas-db'] }}@maas-db.{{ maas_namespace }}.svc:5432/maas?sslmode=verify-full&sslrootcert=/var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt"
  maas-sso-db:
    POSTGRESQL_USER: keycloak
    POSTGRESQL_DATABASE: keycloak
    POSTGRESQL_PASSWORD: "{{ _maas_new['maas-sso-db'] }}"
  maas-sso-admin:
    KC_BOOTSTRAP_ADMIN_USERNAME: maas-admin
    KC_BOOTSTRAP_ADMIN_PASSWORD: "{{ _maas_new['maas-sso-admin'] }}"
  maas-db-config:
    MAASAPI_PASSWORD: "{{ _maas_new['maas-db-config'] }}"
    DB_CONNECTION_URL: "postgresql://maasapi:{{ _maas_new['maas-db-config'] }}@maas-db.{{ maas_namespace }}.svc:5432/maasapi?sslmode=verify-full&sslrootcert=/etc/maas-ca/service-ca.crt"
  maas-usage-oidc:
    client-secret: "{{ _maas_new['maas-usage-oidc'] }}"
  maas-kcadm:
    client-secret: "{{ _maas_new['maas-kcadm'] }}"
  maas-kube-token-seeder: {token: "{{ _maas_new['maas-kube-token-seeder'] }}"}
  maas-kube-token-authorino: {token: "{{ _maas_new['maas-kube-token-authorino'] }}"}
  maas-kube-token-maas-api: {token: "{{ _maas_new['maas-kube-token-maas-api'] }}"}
  maas-kube-token-ipp: {token: "{{ _maas_new['maas-kube-token-ipp'] }}"}
  maas-kube-token-prometheus: {token: "{{ _maas_new['maas-kube-token-prometheus'] }}"}
  maas-kube-token-ops: {token: "{{ _maas_new['maas-kube-token-ops'] }}"}
