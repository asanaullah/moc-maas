# Assisted by Claude Opus
# Keycloak with the GitHub identity provider, then point the
# master realm's login page at the local port-forward address, so
# "oc port-forward deploy/maas-sso 9443:8443" gives a working admin console
# at https://localhost:9443.
- name: Apply Keycloak
  ansible.builtin.include_role:
    name: maas_common
    tasks_from: apply
  vars:
    manifests: [maas-sso.yaml]

- name: Restart Keycloak to pick up its proxy config
  ansible.builtin.include_role:
    name: maas_common
    tasks_from: restart_deployments
  vars:
    deployments: [maas-sso]
    configmaps: [maas-sso-proxy]

- name: Wait for Keycloak
  ansible.builtin.include_role:
    name: maas_common
    tasks_from: wait_deployments
  vars:
    deployments: [maas-sso]

- name: Point the admin console at the port-forward address
  ansible.builtin.include_role:
    name: maas_sso_admin
  vars:
    maas_action: init

- name: Sync the realm with the current Secrets
  ansible.builtin.include_role:
    name: maas_sso_admin
  vars:
    maas_action: sync

- name: Register the OIDC client
  ansible.builtin.include_role:
    name: maas_sso_admin
  vars:
    maas_action: oidc-client
