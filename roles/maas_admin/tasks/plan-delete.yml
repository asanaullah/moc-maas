# Assisted by Claude Opus
- name: Check the arguments
  ansible.builtin.assert:
    that:
      - maas_plan is defined
      - maas_plan is match('^[a-z0-9][a-z0-9._-]{0,62}$')
    fail_msg: set maas_plan to the plan's name
    quiet: true

- name: Delete the plan
  kubernetes.core.k8s_exec:
    namespace: "{{ maas_namespace }}"
    pod: "{{ _maas_pod }}"
    command: "python3 /tmp/maas-api.py POST /api/plans/delete '{{ {'name': maas_plan} | to_json }}' {{ _maas_actor_b64 }}"
  register: _maas_api

- name: Report
  ansible.builtin.debug:
    msg: "{{ _maas_api.stdout }}"
