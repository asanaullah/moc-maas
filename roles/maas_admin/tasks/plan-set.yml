# Assisted by Claude Opus
# Sets or updates a plan; groups map onto plans by name. Every field is set:
# one left out takes its default, also on an existing plan.
- name: Check the arguments
  ansible.builtin.assert:
    that:
      - maas_plan is defined
      - maas_plan is match('^[a-z0-9][a-z0-9._-]{0,62}$')
      - maas_tokens is defined
      - 1 <= maas_tokens | int <= 1000000000000
      - maas_window | default(60) | int <= 2678400
      - maas_days | default(90) | int <= 3650
      - maas_models | default('') is match('^([A-Za-z0-9._/:-]+(,[A-Za-z0-9._/:-]+)*)?$')
      - -1000 <= maas_priority | default(0) | int <= 1000
      - maas_max_request_tokens | default('') | string is match('^([1-9][0-9]{0,6}|10000000)?$')
      - maas_max_requests | default('') | string is match('^([1-9][0-9]{0,8})?$')
      - maas_hourly_tokens | default('') | string is match('^[0-9]{0,13}$')
    fail_msg: >-
      set maas_plan and maas_tokens; optional maas_window (default 60), maas_days (default 90),
      maas_models (comma-separated), maas_priority (default 0; a user in several groups gets the
      highest), maas_max_request_tokens (per-request max_tokens cap), maas_max_requests
      (requests per window per user) and maas_hourly_tokens (hourly token cap; unset: twice the
      average hourly rate for windows over an hour; 0: none)
    quiet: true

- name: Set the plan
  kubernetes.core.k8s_exec:
    namespace: "{{ maas_namespace }}"
    pod: "{{ _maas_pod }}"
    command: "python3 /tmp/maas-api.py POST /api/plans '{{ _maas_body }}' {{ _maas_actor_b64 }}"
  vars:
    _maas_body: "{{ {'name': maas_plan, 'tokens': maas_tokens | int, 'window': (maas_window | default(60)) | int, 'days': (maas_days | default(90)) | int, 'models': maas_models | default('') | split(',') | select | list, 'priority': (maas_priority | default(0)) | int, 'max_request_tokens': (maas_max_request_tokens | int) if (maas_max_request_tokens | default('') | string | length) else none, 'max_requests': (maas_max_requests | int) if (maas_max_requests | default('') | string | length) else none, 'hourly_tokens': (maas_hourly_tokens | int) if (maas_hourly_tokens | default('') | string | length) else none} | to_json }}"
  register: _maas_api

- name: Report
  ansible.builtin.debug:
    msg: "{{ _maas_api.stdout }}"
