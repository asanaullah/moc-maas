# Assisted by Claude Opus
- name: Check the arguments
  ansible.builtin.assert:
    that:
      - maas_key_id is defined
      - maas_key_id is match('^[A-Za-z0-9._-]+$')
    fail_msg: set maas_key_id
    quiet: true

- name: Revoke the key
  ansible.builtin.include_tasks: maas-api.yml
  vars:
    _maas_api_method: DELETE
    _maas_api_path: "/v1/api-keys/{{ maas_key_id }}"

- name: Report
  ansible.builtin.debug:
    msg: "{{ _maas_api_output | from_json }}"

- name: Record the action
  ansible.builtin.include_tasks: audit-write.yml
  vars:
    _maas_target: "key/{{ maas_key_id }}"
    _maas_details: {}
