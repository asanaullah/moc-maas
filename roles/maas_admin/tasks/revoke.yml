# Assisted by Claude Opus
- name: Check the arguments
  ansible.builtin.assert:
    that:
      - maas_key_id is defined
      - maas_key_id is match('^[A-Za-z0-9._-]+$')
    fail_msg: set maas_key_id to the key's id
    quiet: true

- name: Revoke the key
  kubernetes.core.k8s_exec:
    namespace: "{{ maas_namespace }}"
    pod: "{{ _maas_pod }}"
    command: "python3 /tmp/maas-api.py POST /api/keys/revoke '{{ {'id': maas_key_id} | to_json }}' {{ _maas_actor_b64 }}"
  register: _maas_api

- name: Report
  ansible.builtin.debug:
    msg: "{{ _maas_api.stdout }}"
