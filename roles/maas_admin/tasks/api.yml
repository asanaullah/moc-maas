# Assisted by Claude Opus
# One call against the admin portal's JSON API, for playbooks that need
# something the named actions don't cover (the smoke test mints and revokes
# its own key, for instance). The answer is left in maas_api_response (rc,
# stdout, stderr); nothing is printed on success, because some answers carry
# a key — a refusal's error body carries none, so it stays visible.
- name: Check the arguments
  ansible.builtin.assert:
    that:
      - maas_api_method is defined
      - maas_api_method in ['GET', 'POST']
      - maas_api_path is defined
      - maas_api_path is match('^/api/[a-z/-]+$')
      - maas_api_body is defined
    fail_msg: set maas_api_method (GET or POST), maas_api_path (under /api/) and maas_api_body (a dict; empty for GET)
    quiet: true

- name: Make the call
  kubernetes.core.k8s_exec:
    namespace: "{{ maas_namespace }}"
    pod: "{{ _maas_pod }}"
    command: >-
      python3 /tmp/maas-api.py {{ maas_api_method }} {{ maas_api_path }}
      '{{ '' if maas_api_method == 'GET' else (maas_api_body | to_json) }}' {{ _maas_actor_b64 }}
  register: _maas_api_call
  no_log: true
  failed_when: false
  changed_when: maas_api_method == 'POST' and _maas_api_call.rc == 0

- name: Remember the answer
  ansible.builtin.set_fact:
    maas_api_response:
      rc: "{{ _maas_api_call.rc }}"
      stdout: "{{ _maas_api_call.stdout }}"
      stderr: "{{ _maas_api_call.stderr }}"
  no_log: true

- name: Check the call succeeded
  ansible.builtin.assert:
    that: _maas_api_call.rc == 0
    fail_msg: "{{ _maas_api_call.stderr | trim }}"
    quiet: true
