# Assisted by Claude Opus
# One admin action over the governance data or maas-api. Each action file
# checks its own arguments.
- name: Check the action
  ansible.builtin.assert:
    that:
      - maas_admin_action | default(maas_action) is defined
      - maas_admin_action | default(maas_action) in ['help', 'subscriptions', 'subscription-set', 'subscription-delete', 'group-map', 'group-unmap', 'models', 'model-set', 'model-delete', 'render', 'keys', 'revoke', 'revoke-user', 'service-key', 'tui-setup', 'tui-cleanup', 'audit']
    fail_msg: >-
      set maas_action to one of help, subscriptions, subscription-set,
      subscription-delete, group-map, group-unmap, models, model-set,
      model-delete, render, keys, revoke, revoke-user, service-key, tui-setup,
      tui-cleanup, audit
    quiet: true

- name: Remember the action
  ansible.builtin.set_fact:
    _maas_action: "{{ maas_admin_action | default(maas_action) }}"

- name: Who is running this
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: authentication.k8s.io/v1
      kind: SelfSubjectReview
  register: _maas_ssr
  when: _maas_action != 'help'

- name: Remember the operator
  ansible.builtin.set_fact:
    _maas_actor: "{{ _maas_ssr.result.status.userInfo.username | default('') }}"
  when: _maas_action != 'help'

- name: Find a gateway pod
  ansible.builtin.include_role:
    name: maas_common
    tasks_from: find_pod
  vars:
    pod_label: app=maas-gateway
    pod_what: deploy/maas-gateway
  when: _maas_action in ['keys', 'revoke', 'revoke-user', 'service-key', 'tui-cleanup']

- name: "Run {{ _maas_action }}"
  ansible.builtin.include_tasks: "{{ _maas_action }}.yml"
