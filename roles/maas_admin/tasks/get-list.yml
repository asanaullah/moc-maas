# Assisted by Claude Opus
# Shared by the list actions (plans, groups, keys, audit): one GET, then rows
# printed as "k=v" pairs. Callers set _maas_path.
- name: Call the API
  kubernetes.core.k8s_exec:
    namespace: "{{ maas_namespace }}"
    pod: "{{ _maas_pod }}"
    command: "python3 /tmp/maas-api.py GET {{ _maas_path }} '' {{ _maas_actor_b64 }}"
  register: _maas_api

- name: Report the rows
  ansible.builtin.debug:
    msg: "{{ item.items() | map('join', '=') | join('  ') }}"
  loop: "{{ _maas_api.stdout | from_json }}"
  loop_control:
    label: "{{ item.values() | list | first }}"
  when: _maas_api.stdout | from_json | length > 0

- name: Report none
  ansible.builtin.debug:
    msg: (none)
  when: not (_maas_api.stdout | from_json | length > 0)
