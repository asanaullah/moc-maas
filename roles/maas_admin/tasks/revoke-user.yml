# Assisted by Claude Opus
# Lists the user's keys first (the dry run), then revokes them all unless
# maas_dry_run is false. maas-api's bulk revoke has no dry-run flag.
- name: Check the arguments
  ansible.builtin.assert:
    that:
      - maas_username is defined
      - maas_username is match('^[a-zA-Z0-9@._:-]+$')
    fail_msg: set maas_username
    quiet: true

- name: List the user's keys
  ansible.builtin.include_tasks: maas-api.yml
  vars:
    _maas_api_method: POST
    _maas_api_path: /v1/api-keys/search
    _maas_api_body: {filters: {username: "{{ maas_username }}"}}

- name: Report the keys
  ansible.builtin.debug:
    msg: "{{ _maas_api_output | from_json }}"

- name: Revoke every key of the user
  ansible.builtin.include_tasks: maas-api.yml
  vars:
    _maas_api_method: POST
    _maas_api_path: /v1/api-keys/bulk-revoke
    _maas_api_body: {username: "{{ maas_username }}"}
  when: not (maas_dry_run | default(true) | bool)

- name: Record the action
  ansible.builtin.include_tasks: audit-write.yml
  vars:
    _maas_target: "user/{{ maas_username }}"
    _maas_details:
      dry_run: "{{ maas_dry_run | default(true) | bool }}"
