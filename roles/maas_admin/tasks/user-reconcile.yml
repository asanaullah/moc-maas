# Assisted by Claude Opus
# Brings one user's keys in step with the Keycloak groups they still hold,
# and ends their sessions, so they sign in again with current groups.
- name: Check the arguments
  ansible.builtin.assert:
    that:
      - maas_email is defined
      - maas_email is match('^[A-Za-z0-9._@-]+$')
      - maas_groups is defined
      - maas_groups is sequence
      - maas_groups is not string
    fail_msg: set maas_email and maas_groups (the list of groups the user still holds)
    quiet: true

- name: Reconcile the user's keys with their groups
  kubernetes.core.k8s_exec:
    namespace: "{{ maas_namespace }}"
    pod: "{{ _maas_pod }}"
    command: "python3 /tmp/maas-api.py POST /api/users/reconcile '{{ {'owner': maas_email, 'groups': maas_groups} | to_json }}' {{ _maas_actor_b64 }}"
  register: _maas_api

- name: Report
  ansible.builtin.debug:
    msg: "{{ _maas_api.stdout }}"
