# Assisted by Claude Opus
# The dashboard's OIDC client in Keycloak (realm maas), redirecting
# to the dashboard's Route host, then the dashboard itself.
- name: Register the dashboard with Keycloak
  ansible.builtin.include_role:
    name: maas_sso_admin
  vars:
    maas_action: usage-client

- name: Apply the user dashboard
  ansible.builtin.include_role:
    name: maas_common
    tasks_from: apply
  vars:
    manifests: [maas-usage.yaml]

- name: Restart the dashboard to pick up its config
  ansible.builtin.include_role:
    name: maas_common
    tasks_from: restart_deployments
  vars:
    deployments: [maas-usage]
    configmaps: [maas-portal-code]

- name: Wait for the dashboard
  ansible.builtin.include_role:
    name: maas_common
    tasks_from: wait_deployments
  vars:
    deployments: [maas-usage]
