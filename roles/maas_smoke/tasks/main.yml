# Assisted by Claude Opus
# The cross-cutting smoke test: a Keycloak user and group, a small
# subscription, the checks in files/smoke.py through the public Route, then
# the user, group and subscription removed.
- name: Make a password for the smoke user
  ansible.builtin.set_fact:
    _maas_smoke_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars='abcdef0123456789') }}"
  no_log: true

- name: Run the smoke test
  block:
    - name: Create the smoke group
      ansible.builtin.include_role:
        name: maas_sso_admin
      vars:
        maas_action: group-create
        maas_group: maas-smoke

    - name: Create the smoke user
      ansible.builtin.include_role:
        name: maas_sso_admin
      vars:
        maas_action: user-create
        maas_user: maas-smoke
        maas_group: maas-smoke
        maas_password: "{{ _maas_smoke_password }}"

    - name: Give the smoke group a subscription
      ansible.builtin.include_role:
        name: maas_admin
      vars:
        maas_action: subscription-set
        maas_subscription: smoke-test
        maas_groups: maas-smoke
        maas_limits: 200/60s
        maas_priority: 50

    - name: Wait until the private API server has the subscription
      ansible.builtin.command:
        argv:
          - oc
          - exec
          - -n
          - "{{ maas_namespace }}"
          - deploy/maas-kube
          - -c
          - seeder
          - --
          - oc
          - --kubeconfig
          - /kubeconfig/kubeconfig
          - get
          - maassubscriptions.maas.opendatahub.io
          - smoke-test
          - -n
          - "{{ maas_namespace }}"
          - -o
          - jsonpath={.status.phase}
      register: _maas_smoke_sub
      until: _maas_smoke_sub.stdout | trim == 'Active'
      retries: 30
      delay: 5
      changed_when: false

    - name: Run the checks
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ role_path }}/files/smoke.py"
          - "https://{{ maas_gateway_host }}"
          - "https://{{ maas_sso_host }}/realms/maas"
          - "publishers/{{ maas_namespace }}/models/maas-sim"
      environment:
        SMOKE_USER: maas-smoke
        SMOKE_PASSWORD: "{{ _maas_smoke_password }}"
        SMOKE_CLIENT: "{{ maas_oidc_client_id }}"
        CACHE_TTL: "{{ maas_cache_ttl }}"
      register: _maas_smoke
      changed_when: false
      failed_when: false

    - name: Report the checks
      ansible.builtin.debug:
        msg: "{{ _maas_smoke.stdout_lines + (_maas_smoke.stderr_lines | default([])) }}"

    - name: Fail if any check failed
      ansible.builtin.assert:
        that: _maas_smoke.rc == 0
        fail_msg: "{{ _maas_smoke.stdout }}{{ _maas_smoke.stderr | default('') }}"
        quiet: true
  always:
    - name: Remove the smoke subscription
      ansible.builtin.include_role:
        name: maas_admin
      vars:
        maas_action: subscription-delete
        maas_subscription: smoke-test
      ignore_errors: true

    - name: Remove the smoke user
      ansible.builtin.include_role:
        name: maas_sso_admin
      vars:
        maas_action: user-delete
        maas_user: maas-smoke
      ignore_errors: true

    - name: Remove the smoke group
      ansible.builtin.include_role:
        name: maas_sso_admin
      vars:
        maas_action: group-delete
        maas_group: maas-smoke
      ignore_errors: true

    - name: Forget the password
      ansible.builtin.set_fact:
        _maas_smoke_password: ""
      no_log: true
