# Assisted by Claude Opus
# The public addresses. Kept apart from the rest of the
# deployment (deploy.yml runs this role only with -e maas_routes=true) so the
# MaaS can run without public endpoints. The hosts are generated by the
# router, so they are read back and printed rather than guessed.
- name: Apply the public addresses
  ansible.builtin.include_role:
    name: maas_common
    tasks_from: apply
  vars:
    manifests:
      - maas-sso-route.yaml
      - maas-gateway-route.yaml
      - maas-usage-route.yaml

- name: Read the routes' hosts back
  kubernetes.core.k8s_info:
    kind: Route
    namespace: "{{ maas_namespace }}"
    label_selectors: ["app.kubernetes.io/part-of={{ maas_part_of }}"]
  register: _maas_routes

- name: Report the public addresses
  ansible.builtin.debug:
    msg: "{{ item.metadata.name }}: https://{{ item.spec.host | default('(host not assigned yet)') }}/"
  loop: "{{ _maas_routes.resources | sort(attribute='metadata.name') }}"
  loop_control:
    label: "{{ item.metadata.name }}"
