# Assisted by Claude Opus
# Removes the MaaS from its namespace — workloads, Services, Routes,
# ConfigMaps, CronJobs, the InferencePool, the client pod and the MaaS's
# Secrets. The service CA's maas-*-tls Secrets go with their Services.
# Database files and backups on the namespace's storage volume (maas/), and
# the metrics bucket, are kept; so are the generated Secrets those databases
# need, unless maas_wipe_data is set.
- name: Remove the labeled resources
  kubernetes.core.k8s:
    state: absent
    namespace: "{{ maas_namespace }}"
    kind: "{{ item.kind }}"
    api_version: "{{ item.api }}"
    label_selectors: ["app.kubernetes.io/part-of={{ maas_part_of }}"]
    # Dependents go too (the API's default for Jobs would orphan their pods).
    delete_options:
      propagationPolicy: Background
  loop:
    - {kind: Route, api: route.openshift.io/v1}
    - {kind: Deployment, api: apps/v1}
    - {kind: StatefulSet, api: apps/v1}
    - {kind: Service, api: v1}
    - {kind: ConfigMap, api: v1}
    - {kind: CronJob, api: batch/v1}
    - {kind: Job, api: batch/v1}
    - {kind: InferencePool, api: inference.networking.k8s.io/v1}
  loop_control:
    label: "{{ item.kind }}"

# Finished pods (backup runs, restore tests) whose Job is already gone; the
# API's default for Jobs leaves them behind.
- name: Find finished MaaS pods
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ maas_namespace }}"
    label_selectors: ["app.kubernetes.io/part-of={{ maas_part_of }}"]
    field_selectors: ["status.phase!=Running", "status.phase!=Pending"]
  register: _maas_finished_pods

- name: Remove finished MaaS pods
  kubernetes.core.k8s:
    state: absent
    namespace: "{{ maas_namespace }}"
    kind: Pod
    api_version: v1
    name: "{{ item.metadata.name }}"
  loop: "{{ _maas_finished_pods.resources }}"
  loop_control:
    label: "{{ item.metadata.name }}"

# Wait for the deletions to finish, so a deploy right after a teardown
# can't race a terminating object.
- name: Wait for the labeled resources to be gone
  kubernetes.core.k8s_info:
    kind: "{{ item.kind }}"
    api_version: "{{ item.api }}"
    namespace: "{{ maas_namespace }}"
    label_selectors: ["app.kubernetes.io/part-of={{ maas_part_of }}"]
  register: _maas_left
  until: _maas_left.resources | length == 0
  retries: "{{ (maas_rollout_timeout | int / maas_poll_delay | int) | int }}"
  delay: "{{ maas_poll_delay }}"
  loop:
    - {kind: Route, api: route.openshift.io/v1}
    - {kind: Deployment, api: apps/v1}
    - {kind: StatefulSet, api: apps/v1}
    - {kind: Service, api: v1}
    - {kind: ConfigMap, api: v1}
    - {kind: CronJob, api: batch/v1}
    - {kind: InferencePool, api: inference.networking.k8s.io/v1}
  loop_control:
    label: "{{ item.kind }}"

- name: Remove the client pod
  kubernetes.core.k8s:
    state: absent
    namespace: "{{ maas_namespace }}"
    kind: Pod
    api_version: v1
    name: maas-client

- name: Remove the MaaS's Secrets
  kubernetes.core.k8s:
    state: absent
    namespace: "{{ maas_namespace }}"
    kind: Secret
    api_version: v1
    name: "{{ item }}"
  loop: "{{ ['maas-tui-key', 'maas-thanos-objstore']
            + (_maas_data_secrets if maas_wipe_data | default(false) | bool else []) }}"
  vars:
    # These match the data a teardown keeps unless asked to wipe it. The
    # GitHub OAuth app's credentials (maas-sso-github) aren't generated, so
    # they stay either way.
    _maas_data_secrets: [maas-db, maas-sso-db, maas-sso-admin, maas-portal-oidc,
                         maas-usage-oidc, maas-reconciler-oidc, maas-kcadm]
  loop_control:
    label: "{{ item }}"

# Optional, with -e maas_wipe_data=true: also wipe the databases from the
# storage volume, so the next deploy is a fresh install.
- name: Wipe the databases from the storage volume
  ansible.builtin.include_tasks: wipe.yml
  when: maas_wipe_data | default(false) | bool

- name: Note what is left
  ansible.builtin.debug:
    msg: >-
      The MaaS is removed from {{ maas_namespace }}. Database files and backups
      on the storage volume (maas/) were kept, with the Secrets they need
      (maas-db, maas-sso-db, maas-sso-admin, maas-portal-oidc, maas-usage-oidc,
      maas-reconciler-oidc, maas-kcadm) and maas-sso-github; the metrics bucket
      was left alone. Re-run with -e maas_wipe_data=true for a fresh install.
  when: not (maas_wipe_data | default(false) | bool)

- name: Note what is left
  ansible.builtin.debug:
    msg: >-
      The MaaS is removed from {{ maas_namespace }}, and the databases and their
      generated Secrets were wiped; the next deploy is a fresh install. Backups
      (maas/), the metrics bucket and maas-sso-github were kept.
  when: maas_wipe_data | default(false) | bool
