# Assisted by Claude Opus
# The model path. The governance role writes maas-limits, so it is only
# created here when missing, never applied over.
- name: Check the limits ConfigMap
  kubernetes.core.k8s_info:
    kind: ConfigMap
    namespace: "{{ maas_namespace }}"
    name: maas-limits
  register: _maas_have_limits

- name: Create the limits ConfigMap when missing
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: maas-limits
        namespace: "{{ maas_namespace }}"
        labels:
          app.kubernetes.io/part-of: "{{ maas_part_of }}"
      data:
        limits.yaml: "[]"
  when: _maas_have_limits.resources | length == 0

- name: Apply the model path
  ansible.builtin.include_role:
    name: maas_common
    tasks_from: apply
  vars:
    manifests:
      - emulator.yaml
      - redis.yaml
      - limitador.yaml
      - epp.yaml
      - client.yaml

- name: Wait for the model path
  ansible.builtin.include_role:
    name: maas_common
    tasks_from: wait_deployments
  vars:
    deployments: [maas-sim, maas-redis, maas-limitador, maas-epp]
    # With leader election only the active EPP replica is Ready.
    deployments_unavailable_ok: {maas-epp: 1}

- name: Wait for the client pod
  ansible.builtin.include_role:
    name: maas_common
    tasks_from: wait_pods
  vars:
    pods: [maas-client]
