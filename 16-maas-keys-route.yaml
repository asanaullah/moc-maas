# Step 16: expose the key portal outside the cluster. Kept apart from step 14 so
# the portals can run without a public endpoint; apply this only once the
# portal and gateway are ready to face users.
# The OAuth redirect reference on the maas-keys service account names this
# Route, so its name has to stay maas-keys. Its generated host,
# maas-keys-uat-project.apps.<domain>, is the ROUTE_HOST above.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: maas-keys
  namespace: uat-project
  labels:
    app.kubernetes.io/part-of: maas-test
spec:
  to:
    kind: Service
    name: maas-keys
  port:
    targetPort: https
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
