# Step 24: the admin Grafana's dashboards. Generated by 23-gen-dashboards.py;
# edit that and re-run it rather than editing this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-grafana-dashboards
  namespace: uat-project
  labels:
    app.kubernetes.io/part-of: maas-test
data:
  maas-usage.json: |
    {
     "uid": "maas-usage",
     "title": "MaaS usage",
     "description": "Usage per person and per application, against their plans' budgets.",
     "editable": false,
     "schemaVersion": 39,
     "time": {
      "from": "now-6h",
      "to": "now"
     },
     "refresh": "30s",
     "tags": [
      "maas"
     ],
     "panels": [
      {
       "id": 1,
       "type": "stat",
       "title": "Tokens, last 24h",
       "datasource": {
        "type": "prometheus",
        "uid": "maas-thanos"
       },
       "gridPos": {
        "x": 0,
        "y": 0,
        "w": 6,
        "h": 4
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "maas-thanos"
         },
         "expr": "sum(increase(authorized_hits[24h]))",
         "legendFormat": ""
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       }
      },
      {
       "id": 2,
       "type": "stat",
       "title": "Requests counted, last 24h",
       "datasource": {
        "type": "prometheus",
        "uid": "maas-thanos"
       },
       "gridPos": {
        "x": 6,
        "y": 0,
        "w": 6,
        "h": 4
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "maas-thanos"
         },
         "expr": "sum(increase(report_calls[24h]))",
         "legendFormat": ""
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       }
      },
      {
       "id": 3,
       "type": "stat",
       "title": "Refused for budget (429), last 24h",
       "datasource": {
        "type": "prometheus",
        "uid": "maas-thanos"
       },
       "gridPos": {
        "x": 12,
        "y": 0,
        "w": 6,
        "h": 4
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "maas-thanos"
         },
         "expr": "sum(increase(limited_calls[24h]))",
         "legendFormat": ""
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       }
      },
      {
       "id": 4,
       "type": "stat",
       "title": "Active keys",
       "datasource": {
        "type": "prometheus",
        "uid": "maas-thanos"
       },
       "gridPos": {
        "x": 18,
        "y": 0,
        "w": 6,
        "h": 4
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "maas-thanos"
         },
         "expr": "sum by (kind) (maas_keys{status=\"active\"})",
         "legendFormat": "{{kind}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       }
      },
      {
       "id": 5,
       "type": "timeseries",
       "title": "People: tokens per minute",
       "datasource": {
        "type": "prometheus",
        "uid": "maas-thanos"
       },
       "gridPos": {
        "x": 0,
        "y": 4,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "maas-thanos"
         },
         "expr": "sum by (user) (rate(authorized_hits{user!~\"service:.*\"}[5m])) * 60",
         "legendFormat": "{{user}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "description": "Users' own keys. Counted from each response's token usage."
      },
      {
       "id": 6,
       "type": "timeseries",
       "title": "Applications (service keys): tokens per minute",
       "datasource": {
        "type": "prometheus",
        "uid": "maas-thanos"
       },
       "gridPos": {
        "x": 12,
        "y": 4,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "maas-thanos"
         },
         "expr": "sum by (user) (rate(authorized_hits{user=~\"service:.*\"}[5m])) * 60",
         "legendFormat": "{{user}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       }
      },
      {
       "id": 7,
       "type": "timeseries",
       "title": "Refused for budget (429) per minute, by owner",
       "datasource": {
        "type": "prometheus",
        "uid": "maas-thanos"
       },
       "gridPos": {
        "x": 0,
        "y": 12,
        "w": 12,
        "h": 7
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "maas-thanos"
         },
         "expr": "sum by (user) (rate(limited_calls[5m])) * 60",
         "legendFormat": "{{user}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       }
      },
      {
       "id": 8,
       "type": "timeseries",
       "title": "Share of budget, 5-minute average",
       "datasource": {
        "type": "prometheus",
        "uid": "maas-thanos"
       },
       "gridPos": {
        "x": 12,
        "y": 12,
        "w": 12,
        "h": 7
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "maas-thanos"
         },
         "expr": "sum by (user, plan) (rate(authorized_hits[5m])) / on (plan) group_left max by (plan) (maas_plan_budget_tokens / maas_plan_window_seconds)",
         "legendFormat": "{{user}} ({{plan}})"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "percentunit"
        },
        "overrides": []
       },
       "description": "Token rate as a share of the plan's budget rate. Above 100% means the owner is being refused."
      },
      {
       "id": 9,
       "type": "table",
       "title": "Tokens per owner and plan, last 24h",
       "datasource": {
        "type": "prometheus",
        "uid": "maas-thanos"
       },
       "gridPos": {
        "x": 0,
        "y": 19,
        "w": 12,
        "h": 9
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "maas-thanos"
         },
         "expr": "sort_desc(sum by (user, plan) (increase(authorized_hits[24h])))",
         "legendFormat": "",
         "format": "table",
         "instant": true
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "transformations": [
        {
         "id": "organize",
         "options": {
          "excludeByName": {
           "Time": true
          },
          "renameByName": {
           "user": "owner",
           "Value": "tokens"
          }
         }
        }
       ]
      },
      {
       "id": 10,
       "type": "table",
       "title": "Keys",
       "datasource": {
        "type": "prometheus",
        "uid": "maas-thanos"
       },
       "gridPos": {
        "x": 12,
        "y": 19,
        "w": 12,
        "h": 9
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "maas-thanos"
         },
         "expr": "maas_key_info",
         "legendFormat": "",
         "format": "table",
         "instant": true
        }
       ],
       "fieldConfig": {
        "defaults": {},
        "overrides": []
       },
       "description": "Every key, with its owner, kind (user or service), plan in force and status.",
       "transformations": [
        {
         "id": "organize",
         "options": {
          "excludeByName": {
           "Time": true,
           "Value": true,
           "__name__": true,
           "instance": true,
           "job": true,
           "cluster": true,
           "namespace": true,
           "prometheus": true,
           "key_id": true
          }
         }
        }
       ]
      },
      {
       "id": 11,
       "type": "table",
       "title": "Plans",
       "datasource": {
        "type": "prometheus",
        "uid": "maas-thanos"
       },
       "gridPos": {
        "x": 0,
        "y": 28,
        "w": 12,
        "h": 6
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "maas-thanos"
         },
         "expr": "maas_plan_budget_tokens",
         "legendFormat": "",
         "format": "table",
         "instant": true
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "transformations": [
        {
         "id": "organize",
         "options": {
          "excludeByName": {
           "Time": true,
           "__name__": true,
           "instance": true,
           "job": true,
           "cluster": true,
           "namespace": true,
           "prometheus": true
          },
          "renameByName": {
           "Value": "tokens per window"
          }
         }
        }
       ]
      },
      {
       "id": 12,
       "type": "timeseries",
       "title": "Key checks by result",
       "datasource": {
        "type": "prometheus",
        "uid": "maas-thanos"
       },
       "gridPos": {
        "x": 12,
        "y": 28,
        "w": 12,
        "h": 6
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "maas-thanos"
         },
         "expr": "sum by (result) (rate(maas_key_checks_total[5m])) * 60",
         "legendFormat": "{{result}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "description": "ok, invalid (bad, expired or revoked key), missing (no key), model_denied (model not in plan)."
      }
     ],
     "templating": {
      "list": []
     }
    }
  maas-serving.json: |
    {
     "uid": "maas-serving",
     "title": "MaaS serving",
     "description": "Replicas, how the picker spreads load across them, and latency.",
     "editable": false,
     "schemaVersion": 39,
     "time": {
      "from": "now-6h",
      "to": "now"
     },
     "refresh": "30s",
     "tags": [
      "maas"
     ],
     "panels": [
      {
       "id": 1,
       "type": "stat",
       "title": "Replicas ready in the pool",
       "datasource": {
        "type": "prometheus",
        "uid": "maas-thanos"
       },
       "gridPos": {
        "x": 0,
        "y": 0,
        "w": 6,
        "h": 4
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "maas-thanos"
         },
         "expr": "max(llm_d_epp_ready_endpoints)",
         "legendFormat": ""
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       }
      },
      {
       "id": 2,
       "type": "stat",
       "title": "Requests per second",
       "datasource": {
        "type": "prometheus",
        "uid": "maas-thanos"
       },
       "gridPos": {
        "x": 6,
        "y": 0,
        "w": 6,
        "h": 4
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "maas-thanos"
         },
         "expr": "sum(rate(envoy_http_downstream_rq_total{envoy_http_conn_manager_prefix=\"maas\"}[5m]))",
         "legendFormat": ""
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "reqps"
        },
        "overrides": []
       }
      },
      {
       "id": 3,
       "type": "stat",
       "title": "Median time to first token",
       "datasource": {
        "type": "prometheus",
        "uid": "maas-thanos"
       },
       "gridPos": {
        "x": 12,
        "y": 0,
        "w": 6,
        "h": 4
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "maas-thanos"
         },
         "expr": "histogram_quantile(0.5, sum by (le) (rate(llm_d_epp_request_ttft_seconds_bucket[5m])))",
         "legendFormat": ""
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "s"
        },
        "overrides": []
       }
      },
      {
       "id": 4,
       "type": "stat",
       "title": "Gateway 5xx share",
       "datasource": {
        "type": "prometheus",
        "uid": "maas-thanos"
       },
       "gridPos": {
        "x": 18,
        "y": 0,
        "w": 6,
        "h": 4
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "maas-thanos"
         },
         "expr": "sum(rate(envoy_http_downstream_rq_xx{envoy_http_conn_manager_prefix=\"maas\",envoy_response_code_class=\"5\"}[5m])) / sum(rate(envoy_http_downstream_rq_total{envoy_http_conn_manager_prefix=\"maas\"}[5m]))",
         "legendFormat": ""
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "percentunit"
        },
        "overrides": []
       }
      },
      {
       "id": 5,
       "type": "timeseries",
       "title": "Requests per replica (load balancing)",
       "datasource": {
        "type": "prometheus",
        "uid": "maas-thanos"
       },
       "gridPos": {
        "x": 0,
        "y": 4,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "maas-thanos"
         },
         "expr": "sum by (endpoint_name) (rate(llm_d_epp_scheduler_attempts_total[5m]))",
         "legendFormat": "{{endpoint_name}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "reqps"
        },
        "overrides": []
       },
       "description": "Where the endpoint picker sent requests."
      },
      {
       "id": 6,
       "type": "timeseries",
       "title": "Queue per replica",
       "datasource": {
        "type": "prometheus",
        "uid": "maas-thanos"
       },
       "gridPos": {
        "x": 12,
        "y": 4,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "maas-thanos"
         },
         "expr": "max by (model_server_endpoint) (llm_d_epp_per_endpoint_queue_size)",
         "legendFormat": "{{model_server_endpoint}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       }
      },
      {
       "id": 7,
       "type": "timeseries",
       "title": "Running and waiting requests per model pod",
       "datasource": {
        "type": "prometheus",
        "uid": "maas-thanos"
       },
       "gridPos": {
        "x": 0,
        "y": 12,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "maas-thanos"
         },
         "expr": "max by (instance) (vllm:num_requests_running)",
         "legendFormat": "running {{instance}}"
        },
        {
         "refId": "B",
         "datasource": {
          "type": "prometheus",
          "uid": "maas-thanos"
         },
         "expr": "max by (instance) (vllm:num_requests_waiting)",
         "legendFormat": "waiting {{instance}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       }
      },
      {
       "id": 8,
       "type": "timeseries",
       "title": "Time to first token",
       "datasource": {
        "type": "prometheus",
        "uid": "maas-thanos"
       },
       "gridPos": {
        "x": 12,
        "y": 12,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "maas-thanos"
         },
         "expr": "histogram_quantile(0.5, sum by (le) (rate(llm_d_epp_request_ttft_seconds_bucket[5m])))",
         "legendFormat": "p50"
        },
        {
         "refId": "B",
         "datasource": {
          "type": "prometheus",
          "uid": "maas-thanos"
         },
         "expr": "histogram_quantile(0.95, sum by (le) (rate(llm_d_epp_request_ttft_seconds_bucket[5m])))",
         "legendFormat": "p95"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "s"
        },
        "overrides": []
       }
      },
      {
       "id": 9,
       "type": "timeseries",
       "title": "Median time to first token, per owner",
       "datasource": {
        "type": "prometheus",
        "uid": "maas-thanos"
       },
       "gridPos": {
        "x": 0,
        "y": 20,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "maas-thanos"
         },
         "expr": "histogram_quantile(0.5, sum by (le, fairness_id) (rate(llm_d_epp_request_ttft_seconds_bucket[5m])))",
         "legendFormat": "{{fairness_id}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "s"
        },
        "overrides": []
       },
       "description": "By the key's owner (the picker's fairness ID)."
      },
      {
       "id": 10,
       "type": "timeseries",
       "title": "Prefix-cache hit ratio (median)",
       "datasource": {
        "type": "prometheus",
        "uid": "maas-thanos"
       },
       "gridPos": {
        "x": 12,
        "y": 20,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "maas-thanos"
         },
         "expr": "histogram_quantile(0.5, sum by (le) (rate(llm_d_epp_prefix_indexer_hit_ratio_bucket[5m])))",
         "legendFormat": "hit ratio"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "percentunit"
        },
        "overrides": []
       },
       "description": "How much of each prompt the chosen replica already had cached; chat traffic sticks to one replica for this."
      },
      {
       "id": 11,
       "type": "timeseries",
       "title": "Gateway responses by status class",
       "datasource": {
        "type": "prometheus",
        "uid": "maas-thanos"
       },
       "gridPos": {
        "x": 0,
        "y": 28,
        "w": 12,
        "h": 7
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "maas-thanos"
         },
         "expr": "sum by (envoy_response_code_class) (rate(envoy_http_downstream_rq_xx{envoy_http_conn_manager_prefix=\"maas\"}[5m]))",
         "legendFormat": "{{envoy_response_code_class}}xx"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "reqps"
        },
        "overrides": []
       }
      },
      {
       "id": 12,
       "type": "timeseries",
       "title": "Pool balance (standard deviation across replicas)",
       "datasource": {
        "type": "prometheus",
        "uid": "maas-thanos"
       },
       "gridPos": {
        "x": 12,
        "y": 28,
        "w": 12,
        "h": 7
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "maas-thanos"
         },
         "expr": "max(llm_d_epp_std_dev_queue_size)",
         "legendFormat": "queue"
        },
        {
         "refId": "B",
         "datasource": {
          "type": "prometheus",
          "uid": "maas-thanos"
         },
         "expr": "max(llm_d_epp_std_dev_running_requests)",
         "legendFormat": "running"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "description": "Zero means perfectly even load."
      }
     ],
     "templating": {
      "list": []
     }
    }
