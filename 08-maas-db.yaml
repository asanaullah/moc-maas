# Step 8: PostgreSQL for the portals: plans, allowed users and key hashes.
# The password comes from the maas-db Secret, which the uat-harness chart
# generates. Data lives on uat-project-storage under maas/postgres for this
# test; the harness will manage that directory once this is a harness step.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-db
  namespace: uat-project
  labels:
    app.kubernetes.io/part-of: maas-test
    app: maas-db
spec:
  replicas: 1
  # One writer on the data directory at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: maas-db
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: maas-test
        app: maas-db
    spec:
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-16@sha256:9223bb5f0745e66f0e4204ff87d4d1a5283f3726e9b7d9b71d7bdb2a650fc218
          # POSTGRESQL_USER, POSTGRESQL_PASSWORD and POSTGRESQL_DATABASE.
          envFrom:
            - secretRef:
                name: maas-db
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            tcpSocket:
              port: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
              subPath: maas/postgres
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: uat-project-storage
---
apiVersion: v1
kind: Service
metadata:
  name: maas-db
  namespace: uat-project
  labels:
    app.kubernetes.io/part-of: maas-test
spec:
  selector:
    app: maas-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
# Daily logical backup to uat-project-storage under maas/backups, keeping the
# last 14. Start one by hand with:
#   oc create job -n uat-project maas-db-backup-now --from=cronjob/maas-db-backup
apiVersion: batch/v1
kind: CronJob
metadata:
  name: maas-db-backup
  namespace: uat-project
  labels:
    app.kubernetes.io/part-of: maas-test
spec:
  schedule: "15 3 * * *"
  concurrencyPolicy: Forbid
  # Finished backups leave no pods behind: success shows in the CronJob's
  # lastSuccessfulTime and in the dump files. The last failure is kept, with
  # its pod and logs, to diagnose.
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: maas-test
            app: maas-db-backup
        spec:
          restartPolicy: Never
          containers:
            - name: pg-dump
              image: registry.redhat.io/rhel9/postgresql-16@sha256:9223bb5f0745e66f0e4204ff87d4d1a5283f3726e9b7d9b71d7bdb2a650fc218
              command: ["bash", "-c"]
              args:
                - set -euo pipefail;
                  f=/backup/maas-$(date -u +%Y%m%dT%H%M%SZ).dump;
                  pg_dump -h maas-db -U "$POSTGRESQL_USER" -d "$POSTGRESQL_DATABASE" -Fc -f "$f.partial";
                  mv "$f.partial" "$f";
                  ls -1t /backup/maas-*.dump | tail -n +15 | xargs -r rm -f;
                  echo "wrote $f ($(stat -c %s "$f") bytes)"
              env:
                - name: POSTGRESQL_USER
                  valueFrom:
                    secretKeyRef: {name: maas-db, key: POSTGRESQL_USER}
                - name: POSTGRESQL_DATABASE
                  valueFrom:
                    secretKeyRef: {name: maas-db, key: POSTGRESQL_DATABASE}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: {name: maas-db, key: POSTGRESQL_PASSWORD}
              volumeMounts:
                - name: backup
                  mountPath: /backup
                  subPath: maas/backups
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: uat-project-storage
