# Step 14: the two portals, both running 12-portal.py (mounted as portal.py)
# from the maas-portal-code ConfigMap (step 13).
#
# maas-admin: plans, group mappings, service keys, every key and the audit
#   trail. Listens on the pod's localhost only, so there is no Service or
#   Route; reach it with
#   oc port-forward -n uat-project deploy/maas-admin 8081:8080
# maas-keys: users sign in through the MaaS Keycloak (step 10), brokered to
#   GitHub, and request and revoke their own keys (exposed by step 16). Port 8081 answers the gateway's key
#   checks inside the namespace.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-admin
  namespace: uat-project
  labels:
    app.kubernetes.io/part-of: maas-test
    app: maas-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maas-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: maas-test
        app: maas-admin
    spec:
      # From the uat-harness chart: may rewrite the maas-limits ConfigMap only.
      serviceAccountName: maas-admin
      containers:
        - name: portal
          image: registry.access.redhat.com/ubi9/python-312@sha256:2c7a89f9f1e69f2a00036041ef744b45c8830bebcb2f7194f403ca93729bb0cc
          command: ["sh", "-c"]
          args:
            - pip install --quiet --no-cache-dir --target /tmp/deps 'psycopg[binary]==3.2.9'
              && PYTHONPATH=/tmp/deps exec python3 /opt/maas/portal.py
          ports:
            # Metrics only (plans, groups, keys); the admin UI stays on 127.0.0.1:8080.
            - name: metrics
              containerPort: 9100
          env:
            - name: MODE
              value: admin
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: maas-db
                  key: DATABASE_URL
          readinessProbe:
            exec:
              command: ["python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: code
              mountPath: /opt/maas
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: code
          configMap:
            name: maas-portal-code
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-keys
  namespace: uat-project
  labels:
    app.kubernetes.io/part-of: maas-test
    app: maas-keys
spec:
  replicas: 2
  selector:
    matchLabels:
      app: maas-keys
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: maas-test
        app: maas-keys
    spec:
      # From the uat-harness chart: the OAuth client, with no Kubernetes rights.
      serviceAccountName: maas-keys
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: maas-keys
      containers:
        - name: portal
          image: registry.access.redhat.com/ubi9/python-312@sha256:2c7a89f9f1e69f2a00036041ef744b45c8830bebcb2f7194f403ca93729bb0cc
          command: ["sh", "-c"]
          args:
            - pip install --quiet --no-cache-dir --target /tmp/deps 'psycopg[binary]==3.2.9'
              && PYTHONPATH=/tmp/deps exec python3 /opt/maas/portal.py
          env:
            - name: MODE
              value: keys
            - name: ROUTE_HOST
              value: maas-keys-uat-project.apps.oac-dev-workload0.hcp.oac.int.massopen.cloud
            - name: OIDC_ISSUER
              value: https://maas-sso-uat-project.apps.oac-dev-workload0.hcp.oac.int.massopen.cloud/realms/maas
            # Token requests go to Keycloak directly over the Service, checked
            # against the service CA, not out through the router.
            - name: OIDC_BACKCHANNEL
              value: https://maas-sso.uat-project.svc:8443/realms/maas
            - name: OIDC_CLIENT_ID
              value: maas-portal
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: maas-portal-oidc
                  key: client-secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: maas-db
                  key: DATABASE_URL
          ports:
            - name: https
              containerPort: 8443
            - name: validate
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: code
              mountPath: /opt/maas
            - name: tls
              mountPath: /etc/tls
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: code
          configMap:
            name: maas-portal-code
        - name: tls
          secret:
            secretName: maas-keys-tls
---
# The service CA writes a certificate for maas-keys.uat-project.svc into the
# maas-keys-tls Secret; the Route re-encrypts to it.
apiVersion: v1
kind: Service
metadata:
  name: maas-keys
  namespace: uat-project
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: maas-keys-tls
  labels:
    app.kubernetes.io/part-of: maas-test
spec:
  selector:
    app: maas-keys
  ports:
    - name: https
      port: 8443
      targetPort: 8443
    - name: validate
      port: 8081
      targetPort: 8081
