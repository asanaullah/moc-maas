# Step 25: the admin dashboard, our own Grafana. No Route, and it listens on its
# pod's 127.0.0.1 only, so the only way in is
#   oc port-forward -n uat-project deploy/maas-grafana 3000:3000
# then http://localhost:3000/. Viewing is anonymous and read-only; there's no
# login form and nobody can edit, so no one can add a data source or change a
# dashboard. Data source and dashboards come from files (steps 24 and this
# one), and Grafana's own database is an emptyDir: nothing in it needs keeping.

apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-grafana-provisioning
  namespace: uat-project
  labels:
    app.kubernetes.io/part-of: maas-test
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: MaaS metrics
        uid: maas-thanos
        type: prometheus
        access: proxy
        url: http://maas-thanos-query.uat-project.svc.cluster.local:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: 30s
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: maas
        folder: MaaS
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /var/lib/grafana-dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-grafana
  namespace: uat-project
  labels:
    app.kubernetes.io/part-of: maas-test
    app: maas-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maas-grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: maas-test
        app: maas-grafana
    spec:
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:11.6.0
          env:
            - {name: GF_SERVER_HTTP_ADDR, value: 127.0.0.1}
            - {name: GF_SERVER_HTTP_PORT, value: "3000"}
            - {name: GF_PATHS_DATA, value: /var/lib/grafana}
            - {name: GF_PATHS_PROVISIONING, value: /etc/grafana/provisioning-maas}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true"}
            - {name: GF_AUTH_BASIC_ENABLED, value: "false"}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_USERS_VIEWERS_CAN_EDIT, value: "false"}
            - {name: GF_UNIFIED_ALERTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false"}
            - {name: GF_NEWS_NEWS_FEED_ENABLED, value: "false"}
            - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true"}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana-dashboards/maas-usage.json}
          readinessProbe:
            exec:
              command: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: provisioning, mountPath: /etc/grafana/provisioning-maas/datasources/datasources.yaml, subPath: datasources.yaml, readOnly: true}
            - {name: provisioning, mountPath: /etc/grafana/provisioning-maas/dashboards/dashboards.yaml, subPath: dashboards.yaml, readOnly: true}
            - {name: dashboards, mountPath: /var/lib/grafana-dashboards, readOnly: true}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 1Gi}
        - name: provisioning
          configMap: {name: maas-grafana-provisioning}
        - name: dashboards
          configMap: {name: maas-grafana-dashboards}
