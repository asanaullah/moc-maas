# Assisted by Claude Opus
# Creates or updates the maas-sso-github Secret from MOC_MAAS_CLIENTID and
# MOC_MAAS_SECRET in your environment. Keycloak reads it for the GitHub
# login. Re-run this to rotate the secret.
#
#   MOC_MAAS_CLIENTID=... MOC_MAAS_SECRET=... \
#     ansible-playbook -i clusters/oac-dev-workload0.yml playbooks/github-secret.yml
- name: GitHub identity provider secret
  hosts: localhost
  gather_facts: false
  vars:
    maas_secrets_generated: false
    maas_secrets_github_apply: true
  roles:
    - maas_secrets
  tasks:
    - name: Restart Keycloak to load the new secret into its environment
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: maas-sso
            namespace: "{{ maas_namespace }}"
          spec:
            template:
              metadata:
                annotations:
                  kubectl.kubernetes.io/restartedAt: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"

    - name: Wait for Keycloak
      ansible.builtin.include_role:
        name: maas_common
        tasks_from: wait_deployments
      vars:
        deployments: [maas-sso]

    - name: Push the new values into the realm
      ansible.builtin.include_role:
        name: maas_sso_admin
      vars:
        maas_action: sync
