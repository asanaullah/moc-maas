# Assisted by Claude Opus
# Creates or updates the maas-sso-github Secret from MOC_MAAS_CLIENTID and
# MOC_MAAS_SECRET in your environment. Keycloak reads it for the GitHub
# login. Re-run this to rotate the secret.
#
#   MOC_MAAS_CLIENTID=... MOC_MAAS_SECRET=... \
#     ansible-playbook -i clusters/oac-dev-workload0.yml playbooks/github-secret.yml
- name: GitHub identity provider secret
  hosts: localhost
  gather_facts: false
  vars:
    maas_secrets_generated: false
    maas_secrets_github_apply: true
  roles:
    - maas_secrets
