# Assisted by Claude Opus
# A first subscription, its access policy, and the Keycloak group that grants
# it. Users added to the group (playbooks/sso-admin.yml -e maas_action=add)
# can then create keys under the subscription. Re-running updates it.
#
#   ansible-playbook -i clusters/oac-dev-workload0.yml playbooks/first-plan.yml
#
# Everything can be overridden with -e:
#   -e maas_group=maas-standard -e maas_subscription=standard -e maas_limits=20000/60s
#   -e maas_models=maas-sim
- name: First subscription
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - name: Check the deployment target
      ansible.builtin.include_role:
        name: maas_common
        tasks_from: preflight
  vars:
    maas_group: maas-standard
    maas_subscription: standard
    maas_limits: 20000/60s
  tasks:
    - name: List the Keycloak groups
      ansible.builtin.include_role:
        name: maas_sso_admin
      vars:
        maas_action: groups

    - name: Report the existing group
      ansible.builtin.debug:
        msg: "Keycloak group {{ maas_group }} exists"
      when: maas_group in _maas_groups

    - name: Create the group when it is missing
      ansible.builtin.include_role:
        name: maas_sso_admin
      vars:
        maas_action: group-create
      when: maas_group not in _maas_groups

    - name: Create or update the subscription and its access policy
      ansible.builtin.include_role:
        name: maas_admin
      vars:
        maas_action: subscription-set
        maas_groups: "{{ maas_group }}"

    - name: Summarize
      ansible.builtin.debug:
        msg: "Members of {{ maas_group }} get subscription {{ maas_subscription }}: {{ maas_limits }}, models {{ maas_models | default('all') }}."
