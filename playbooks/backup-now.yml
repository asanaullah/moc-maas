# Assisted by Claude Opus
# Runs both database backups now, from their CronJobs, and waits for them.
# Dumps land on the namespace's storage volume under maas/backups and
# maas/sso-backups.
#
#   ansible-playbook -i clusters/oac-dev-workload0.yml playbooks/backup-now.yml
- name: Database backups
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - name: Check the deployment target
      ansible.builtin.include_role:
        name: maas_common
        tasks_from: preflight
  roles:
    - maas_backup
