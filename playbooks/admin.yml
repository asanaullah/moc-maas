# Assisted by Claude Opus
# MaaS admin from the command line. Governance actions edit ConfigMap
# maas-governance and re-render it; key actions call maas-api inside a
# gateway pod with the reserved admin group.
#
#   ansible-playbook -i clusters/oac-dev-workload0.yml playbooks/admin.yml -e maas_action=<action>
#
#   maas_action=help          # list every action and its arguments
#   maas_action=subscriptions
#   maas_action=subscription-set -e maas_subscription=standard -e maas_groups=maas-standard
#                           -e maas_limits=24000/24h,2000/1h
#                           [-e maas_users=a,b] [-e maas_priority=10] [-e maas_models=maas-sim]
#   maas_action=subscription-delete -e maas_subscription=standard
#   maas_action=group-map   -e maas_group=maas-standard -e maas_subscription=standard
#   maas_action=group-unmap -e maas_group=maas-standard -e maas_subscription=standard
#   maas_action=models
#   maas_action=model-set   -e maas_model=maas-sim [-e maas_served_name=maas-sim]
#   maas_action=model-delete -e maas_model=maas-sim
#   maas_action=render
#   maas_action=keys [-e maas_username=<user>]
#   maas_action=revoke      -e maas_key_id=<id>
#   maas_action=revoke-user -e maas_username=<user> [-e maas_dry_run=false]
#   maas_action=service-key -e maas_owner=<owner> -e maas_key_name=<name>
#                           -e maas_subscription=<sub> -e maas_days=30
#                           [-e maas_secret_name=<name>]   # store the key in that Secret,
#                                                           # print only its id
#   maas_action=tui-setup
#   maas_action=tui-cleanup
#   maas_action=audit [-e maas_since=<timestamp>]
#
# Every action records the operator (from a SelfSubjectReview) in the audit trail.
- name: MaaS admin
  hosts: localhost
  gather_facts: false
  roles:
    - maas_admin
