# Assisted by Claude Opus
# Checks the gateway's routes and guards through the public Route:
#   - the maas-api paths, the three model paths and the 404s;
#   - a 5 MiB body refused with 413;
#   - client routing and model headers having no effect;
#   - the key never reaching the model.
#
#   MOC_MAAS_KEY=... ansible-playbook -i clusters/oac-dev-workload0.yml playbooks/test-gateway.yml
- name: Test the gateway
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - name: Check the deployment target
      ansible.builtin.include_role:
        name: maas_common
        tasks_from: preflight
  roles:
    - maas_common
  tasks:
    - name: Check the key
      ansible.builtin.assert:
        that: lookup('ansible.builtin.env', 'MOC_MAAS_KEY') | length > 0
        fail_msg: set MOC_MAAS_KEY to your MaaS API key
        quiet: true

    - name: Run the gateway checks
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../roles/maas_smoke/files/gateway_test.py"
          - "https://{{ maas_gateway_host }}"
          - "publishers/{{ maas_namespace }}/models/maas-sim"
          - "{{ maas_namespace }}"
      environment:
        MOC_MAAS_KEY: "{{ lookup('ansible.builtin.env', 'MOC_MAAS_KEY') }}"
      register: _maas_gateway_test
      changed_when: false
      failed_when: false

    - name: Report
      ansible.builtin.debug:
        msg: "{{ _maas_gateway_test.stdout_lines }}"

    - name: Fail if any check failed
      ansible.builtin.assert:
        that: _maas_gateway_test.rc == 0
        fail_msg: "{{ _maas_gateway_test.stdout }}"
        quiet: true
